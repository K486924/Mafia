<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mafia Multiplayer</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  /* ===== MAFIA design system: charcoal, ivory, muted bronze. Role colours are a local accent layer (body[data-role]). ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg1:#111111; --bg2:#191919; --card:#202020; --line:#39332D; --txt:#EAE5DA; --mut:#A6A198;
    --bronze:#A98C62; --gold:#B49A68; --burgundy:#762B32; --burgundy-hi:#8A3640;
    --c-civilian:#54D477; --c-special:#F2C451; --c-mafia:#E05252; --c-shapeshifter:#E34B86; --c-doctor:#42CDE0; --c-detective:#64748B;
    --role-accent:#B49A68; --role-soft:rgba(180,154,104,.12);
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --serif: Georgia, 'Times New Roman', serif;
  }
  body[data-role="civilian"]     { --role-accent:#54D477; --role-soft:rgba(84,212,119,.12); }
  body[data-role="special"]      { --role-accent:#F2C451; --role-soft:rgba(242,196,81,.12); }
  body[data-role="mafia"]        { --role-accent:#E05252; --role-soft:rgba(224,82,82,.12); }
  body[data-role="shapeshifter"] { --role-accent:#E34B86; --role-soft:rgba(227,75,134,.12); }
  body[data-role="doctor"]       { --role-accent:#42CDE0; --role-soft:rgba(66,205,224,.12); }
  body[data-role="detective"]    { --role-accent:#64748B; --role-soft:rgba(100,116,139,.16); }
  html, body { min-height: 100%; }
  body { font-family: var(--sans); background: linear-gradient(180deg, var(--bg2), var(--bg1) 60%) fixed; color: var(--txt); padding: 16px; display: flex; justify-content: center; }
  body.night { --bg2:#0e0e0e; --bg1:#0a0a0a; }
  button, input, select { font-family: inherit; }
  .app { width: 100%; max-width: 480px; padding-bottom: 30px; }
  h1 { font-family: var(--serif); font-size: 28px; font-weight: normal; text-align: center; letter-spacing: 6px; margin: 28px 0 4px; color: var(--gold); }
  .sub { text-align: center; color: var(--mut); font-family: var(--serif); font-style: italic; margin-bottom: 18px; }
  h2, h3 { font-family: var(--serif); font-weight: normal; margin-bottom: 10px; letter-spacing: .5px; color: var(--txt); }
  h3 { font-size: 17px; }
  input { width: 100%; padding: 13px 14px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: #151515; color: var(--txt); font-size: 16px; outline: none; }
  input:focus, select:focus { border-color: var(--bronze); }
  button { width: 100%; padding: 13px; margin: 6px 0; border: 1px solid transparent; border-radius: 8px; background: var(--burgundy); color: var(--txt); font-size: 15px; font-weight: 600; letter-spacing: .3px; cursor: pointer; transition: transform .1s, background .2s, border-color .2s; }
  button:hover { background: var(--burgundy-hi); }
  button:active { transform: scale(.98); }
  button.gray { background: transparent; border-color: var(--line); color: var(--txt); }
  button.gray:hover { background: var(--card); border-color: var(--bronze); }
  button.act { background: var(--role-soft); border-color: var(--role-accent); color: var(--txt); }
  button.act:hover { background: var(--role-soft); filter: brightness(1.25); }
  .card { background: var(--card); border-radius: 10px; padding: 16px; margin: 12px 0; border: 1px solid var(--line); animation: rise .5s both; }
  .muted { color: var(--mut); font-size: 14px; }
  .alert { background: rgba(118,43,50,.25); border: 1px solid var(--burgundy); color: #E8C9C9; padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .code { font-family: var(--serif); font-size: 22px; letter-spacing: 5px; color: var(--gold); }
  .pill { background: transparent; color: var(--txt); border: 1px solid var(--line); border-left: 3px solid var(--role-accent); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
  .role { display: flex; gap: 14px; align-items: center; border-left: 3px solid var(--role-accent); background: linear-gradient(90deg, var(--role-soft), var(--card) 70%); animation: reveal .9s both; }
  .role .em { font-size: 34px; }
  .role b { font-family: var(--serif); font-weight: normal; font-size: 20px; color: var(--role-accent); letter-spacing: .5px; }
  .role[data-rt="civilian"] { --role-accent:#54D477; --role-soft:rgba(84,212,119,.12); }
  .role[data-rt="special"] { --role-accent:#F2C451; --role-soft:rgba(242,196,81,.12); }
  .role[data-rt="mafia"] { --role-accent:#E05252; --role-soft:rgba(224,82,82,.12); }
  .role[data-rt="shapeshifter"] { --role-accent:#E34B86; --role-soft:rgba(227,75,134,.12); }
  .role[data-rt="doctor"] { --role-accent:#42CDE0; --role-soft:rgba(66,205,224,.12); }
  .role[data-rt="detective"] { --role-accent:#64748B; --role-soft:rgba(100,116,139,.16); }
  @keyframes reveal { from { opacity: 0; transform: translateY(8px) scale(.98); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  #story { margin: 14px 0; min-height: 10px; }
  .line { margin: 10px 0; font-size: 16px; line-height: 1.6; color: var(--txt); }
  .line.phase { font-family: var(--serif); font-size: 18px; font-style: italic; padding-left: 10px; border-left: 3px solid var(--role-accent); }
  .line.role, .line.info { color: var(--role-accent); }
  .line.role { display: block; }
  .w { opacity: 0; display: inline-block; animation: fadeWord .6s forwards; }
  @keyframes fadeWord { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .chat { background: #151515; border-radius: 8px; padding: 10px; min-height: 90px; max-height: 190px; overflow-y: auto; margin-bottom: 8px; font-size: 14px; }
  .chat div { margin-bottom: 4px; animation: rise .3s both; }
  .row { display: flex; gap: 8px; }
  .row button { width: auto; padding: 0 20px; margin: 0; }
  .row input { margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .grid button { display: flex; align-items: center; gap: 8px; text-align: left; background: var(--card); border: 1px solid var(--line); color: var(--txt); font-weight: 500; margin: 0; animation: rise .4s both; }
  .grid button:hover, .grid button:active { border-color: var(--role-accent); background: var(--role-soft); }
  .grid button.sel { border-color: var(--role-accent); background: var(--role-soft); box-shadow: inset 3px 0 0 var(--role-accent); }
  .grid button.skip { grid-column: 1 / -1; justify-content: center; color: var(--mut); }
  .av { width: 30px; height: 30px; border-radius: 50%; background: #2B2722; border: 1px solid var(--bronze); color: var(--gold); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex: none; }
  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .pc { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; animation: rise .4s both; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .pc small { display: block; color: var(--mut); font-size: 11px; }
  .pc small.rl[data-rt="civilian"] { color: var(--c-civilian); } .pc small.rl[data-rt="special"] { color: var(--c-special); }
  .pc small.rl[data-rt="mafia"] { color: var(--c-mafia); } .pc small.rl[data-rt="shapeshifter"] { color: var(--c-shapeshifter); }
  .pc small.rl[data-rt="doctor"] { color: var(--c-doctor); } .pc small.rl[data-rt="detective"] { color: var(--c-detective); filter: brightness(1.35); }
  .pc.dead { opacity: .45; } .pc.dead .nm { text-decoration: line-through; } .pc.dead .av { border-color: #444; color: #777; }
  .win { text-align: center; font-family: var(--serif); font-size: 21px; color: var(--gold); border-color: var(--bronze); }
  .chk { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-size: 15px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .chk:last-child { border-bottom: 0; }
  .chk input { width: 18px; height: 18px; margin: 2px 0 0; padding: 0; flex: none; accent-color: var(--bronze); border: 0; background: none; border-radius: 0; }
  .chk small { display: block; color: var(--mut); font-size: 12px; }
  .chk.off { opacity: .4; }
  select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: #151515; color: var(--txt); font-size: 16px; outline: none; }
  .section-h { font-size: 12px; color: var(--bronze); text-transform: uppercase; letter-spacing: 1.5px; margin: 14px 0 4px; }
  .prompt-card { background: var(--role-soft); border: 1px solid var(--role-accent); padding: 16px; border-radius: 10px; margin: 12px 0; }
  .prompt-card.rebel { background: var(--role-soft); border-color: var(--role-accent); }
  .prompt-card h3 { color: var(--role-accent); margin-bottom: 8px; }
  .tm { font-weight: 600; margin-right: 8px; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--gold); }
  .tm.low { color: #E05252; animation: pulse .8s infinite alternate; }
  @keyframes pulse { to { opacity: .45; } }
  #ov { position: fixed; inset: 0; background: rgba(0,0,0,.78); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  #ov .card { max-width: 340px; width: 100%; background: var(--card); }
  .chat-card { padding: 12px 16px; }
  .chat-toggle { display: flex; justify-content: space-between; align-items: center; background: transparent; border: 0; color: var(--txt); padding: 4px 0; margin: 0; font-weight: 600; text-align: left; width: 100%; }
  .chat-toggle:hover { background: transparent; }
  .chat-toggle .chev { font-size: 11px; opacity: .6; transition: transform .15s; display: inline-block; }
  .chat-toggle.collapsed .chev { transform: rotate(-90deg); }
  .chat-badge { background: var(--gold); color: #111; border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 700; margin-left: 6px; }
  .chat-body { margin-top: 8px; }
  .chat-messages-wrap { position: relative; }
  .chat-messages { background: #151515; border-radius: 8px; padding: 10px; min-height: 90px; max-height: 190px; overflow-y: auto; font-size: 14px; margin-bottom: 8px; }
  .chat-messages div { margin-bottom: 4px; }
  .chat-new-btn { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: auto; padding: 6px 14px; margin: 0; background: var(--gold); color: #111; font-size: 12px; font-weight: 700; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .chat-new-btn:hover { background: var(--gold); }
  .game-credits { text-align: center; margin: 22px 0 8px; padding: 10px 8px; color: var(--mut); font-size: 11px; letter-spacing: .45px; line-height: 1.6; }
  .game-credits small { display: block; margin-top: 3px; font-size: 9px; opacity: .7; }
  .credit-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .credit-row:last-child { border-bottom: 0; }
  .credit-row span:first-child { color: var(--mut); }
  .credit-row span:last-child { text-align: right; }
  .vdot { width: 11px; height: 11px; border-radius: 50%; margin-left: auto; flex: none; }
  .vdot.yes { background: #54D477; }
  .vdot.no { background: #E05252; }
  .ghost-card { border-style: dashed; }
  .ghost-card .chat-messages div { color: var(--mut); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const $ = id => document.getElementById(id);
const app = $('app');
/* ============================================================
   SOUND ENGINE: Web Audio synthesizer, no files needed
   ============================================================ */
const SFX = (() => {
  let ctx = null, enabled = true;
  function unlock() {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { enabled = false; }
  }
  function tone(freq, dur, type = 'sine', vol = 0.1, slideTo = null) {
    if (!enabled || !ctx) return;
    try {
      const t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const chord = (fs, dur, type, vol) => fs.forEach(f => tone(f, dur, type, vol));
  return {
    unlock,
    setEnabled(v) { enabled = v; },
    isEnabled: () => enabled,
    click()  { tone(880, 0.04, 'square', 0.05); },
    ping()   { chord([880, 1320], 0.14, 'sine', 0.07); },
    night()  { chord([110, 165], 0.55, 'sine', 0.10); },
    day()    { chord([440, 660], 0.30, 'triangle', 0.08); },
    kill()   { tone(200, 0.45, 'sawtooth', 0.12, 60); },
    save()   { chord([523, 659, 784], 0.30, 'sine', 0.09); },
    yourTurn(){ chord([988, 1319], 0.18, 'sine', 0.09); },
    win()    { chord([523, 659, 784, 1047], 0.6, 'sine', 0.10); },
    lose()   { chord([220, 174, 146], 0.55, 'sawtooth', 0.10); }
  };
})();
try { if (localStorage.getItem('mafia-muted') === '1') SFX.setEnabled(false); } catch(e) {}
['click', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, SFX.unlock, { once: true, passive: true }));

const ROLES = {
  mafia: ['Mafia', 'Kill one player each night.', '🔪'],
  granny: ['Granny', 'If mafia picks you, the mafia dies instead.', '👵'],
  doctor: ['Doctor', 'Save one player each night.', '💉'],
  detective: ['Detective', 'Investigate one player each night.', '🕵️'],
  civilian: ['Civilian', 'Find the mafia and vote them out.', '🧑‍🌾']
};
ROLES.jester = ['Jester', 'Get voted out during the day to win the game.', '🤡'];
ROLES.shapeshifter = ['Shapeshifter', 'A secret Mafia. Once per game, if voted out, swap names with another Mafia who dies in your place. Needs 7+ players.', '👤'];
ROLES.guard = ['Guard', 'Each night, protect one player from the Mafia. Cannot protect yourself.', '🛡️'];
ROLES.judge = ['Judge', 'Once per game: when exactly two players tie for execution, you may call a retrial.', '⚖️'];
ROLES.mayor = ['Mayor', 'Your vote counts double. Your identity stays secret.', '🏛️'];
ROLES.rebel = ['Rebel', 'Once per game: refuse your own execution. You lose your next day vote.', '✊'];
ROLES.oracle = ['Oracle', 'Once per game at night: learn whether two players are in the same faction.', '🔮'];
const ACTIVE_ROLES = ['mafia', 'shapeshifter', 'doctor', 'guard', 'detective', 'oracle'];
const OPTIONAL_ROLES = ['doctor', 'detective', 'granny', 'jester', 'shapeshifter', 'guard', 'judge', 'mayor', 'rebel', 'oracle'];
const DEFAULT_OPTS = { doctor: true, detective: true, granny: true, jester: false, shapeshifter: false, guard: false, judge: false, mayor: false, rebel: false, oracle: false, time: 90 };
const needsAct = p => p.alive && ACTIVE_ROLES.includes(p.role) && !(p.role === 'oracle' && p.oracleUsed);
const HOW_TO_PLAY = [
  { h: 'What is Mafia?', p: 'Mafia is a game about lying and guessing. Some players are bad guys (the Mafia). Most are good guys (the Civilians). Nobody knows who anyone is… except the Mafia know each other.' },
  { h: '🌙 Night', p: 'The Mafia pick one person to kill. The Doctor picks one person to save. The Detective picks one person to check. Then morning comes and everyone finds out what happened.' },
  { h: '☀️ Day', p: 'Everyone talks, argues, and votes for who they think is Mafia. The player with the most votes is kicked out, and their role is revealed.' },
  { h: '🔪 Mafia', p: 'Kill one player each night. You and the other Mafia know each other.' },
  { h: '💉 Doctor', p: 'Save one person each night. If you save the same person the Mafia kills, nobody dies. You can save yourself.' },
  { h: '🕵️ Detective', p: 'Each night, check one player. You find out if they are Mafia or not. You cannot check yourself.' },
  { h: '🧑‍🌾 Civilian', p: 'No special power. Just talk, listen, and vote. Watch for lies!' },
  { h: '🤡 Jester (optional)', p: 'You win alone if the town votes you out. Act suspicious, but not too suspicious!' },
  { h: '🏆 How to Win', p: '🔪 Mafia win when no good guys are left, or when Mafia are as many as the good guys. 🧑‍🌾 Good guys win when all the Mafia are dead.' },
];
const WHATS_NEW = [
  { h: '🛡️ Guard', p: 'Each night, protect one person from the Mafia. You cannot protect yourself, but you can protect the same person two nights in a row.' },
  { h: '👵 Granny', p: 'If the Mafia attacks Granny, the Mafia dies instead! Granny is a trap, so the Mafia should NOT pick her.' },
  { h: '⚖️ Judge', p: 'Once per game: if exactly two players tie for the most votes, the Judge can call a retrial, a second vote between just those two. If the Judge says no, nobody dies that day.' },
  { h: '🏛️ Mayor', p: 'Your vote counts as TWO votes. If you vote for Bob, Bob gets 2 votes from you alone. Your identity stays secret. Voting Skip still counts as 1.' },
  { h: '✊ Rebel', p: 'Once per game: if you are voted out, you can refuse to die. You survive, but you lose your vote the next day.' },
  { h: '🔮 Oracle', p: 'Once per game, at night: pick two players and learn if they are on the SAME team or DIFFERENT teams. You never learn exact roles. You can pick "Not tonight" to save your power.' },
  { h: '👤 Shapeshifter', p: 'A secret Mafia. Once per game: if you are voted out, swap names with another Mafia who dies in your place. You survive! Needs 7+ players.' },
  { h: '⚙️ Turn roles on or off', p: 'The host can switch the optional roles on or off in the lobby before the game starts.' },
];
const CREDITS_FOOTER = `<footer class="game-credits"><div>An original game by K486924</div><small>© 2026 K486924 · All rights reserved</small></footer>`;
function showCredits() {
  app.innerHTML = `
    <h1>🕵️ MAFIA</h1>
    <p class="sub">Credits</p>
    <div class="card">
      <div class="credit-row"><span>Created by</span><span>K486924</span></div>
      <div class="credit-row"><span>Design &amp; code</span><span>K486924</span></div>
      <div class="credit-row"><span>Multiplayer</span><span>PeerJS (peer-to-peer)</span></div>
      <div class="credit-row"><span>Sound</span><span>Web Audio API</span></div>
    </div>
    <div class="card"><h3>Thanks for playing</h3><p class="muted">Gather your friends, trust no one, and may the best side win.</p></div>
    <button class="gray" onclick="home()">← Back to Menu</button>
    ${CREDITS_FOOTER}`;
  window.scrollTo({ top: 0 });
}
function showHelp(kind) {
  const how = kind === 'howto', data = how ? HOW_TO_PLAY : WHATS_NEW;
  app.innerHTML = `
    <h1>🕵️ MAFIA</h1>
    <p class="sub">${how ? 'Learn the rules' : 'New roles we added'}</p>
    ${data.map(x => `<div class="card"><h3>${esc(x.h)}</h3><p>${esc(x.p)}</p></div>`).join('')}
    <button class="gray" onclick="home()">← Back to Menu</button>
    ${CREDITS_FOOTER}`;
  window.scrollTo({ top: 0 });
}
const TIMES = [45, 60, 90, 120, 180]; // day voting time options (seconds)
const WORD_MS = 140; // typing speed: lower = faster

/* --- RECONNECT SUPPORT --- */
const JUDGE_MS = 30000, REBEL_MS = 15000;
const NIGHT_MS = 75000;                  // night auto-skips idle players after this
const GRACE_MS = 120000;                 // 2-minute reconnect grace
const TOKEN_KEY = 'mafia-token';
const SESSION_KEY = 'mafia-session';
let memToken = null;
function getToken() {
  try {
    let t = localStorage.getItem(TOKEN_KEY);
    if (!t) { t = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(TOKEN_KEY, t); }
    return t;
  } catch (e) {
    if (!memToken) memToken = Math.random().toString(36).slice(2) + Date.now().toString(36);
    return memToken;
  }
}
function saveSession(code, name) { try { localStorage.setItem(SESSION_KEY, JSON.stringify({code, name})); } catch(e) {} }
function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch(e) {} }
function loadSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch(e) { return null; } }

let endAt = 0, lpT = null;
const CHAT_STICK_BOTTOM = false;   // false: never auto-scroll, show a ↓ button. true: follow new messages when already at the bottom
let chatExpanded = true, chatUnread = 0, chatSeenSig = '', chatSeenN = 0, chatSeenInit = false, chatDomSig = '', lastBotHtml = '', lastTopHtml = '', chatRestore = null, ghostExpanded = true, ghostUnread = 0, ghostSeenN = 0, ghostSeenInit = false, ghostDomSig = '', ghostRestore = null;
let soundPhase = '', soundLog = 0, soundChatN = 0, soundGhostN = 0, soundPromptKey = '', soundInit = false;
let peer, isHost = false, myId, myName, hostConn, G = null, V = null, code = '', sess = 0, busy = false;

const isM = r => r === 'mafia' || r === 'shapeshifter';
const publicName = p => p.displayName || p.name;
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function cleanup() {
  sess++; busy = false;
  try { if (peer) peer.destroy(); } catch(e) {}
  peer = null; hostConn = null; G = null; isHost = false;
}

/* --- WORD-BY-WORD FADE TEXT --- */
let Q = [], qBusy = false, qGen = 0, seenLog = -1, lastKey = '', roleShown = false, infoRound = 0, overShown = false;

/* ROLE THEME: local only, derived from this player's own v.you.role; never sent over the network */
const ROLE_THEME = { civilian:'civilian', judge:'special', mayor:'special', guard:'special', rebel:'special', oracle:'special', granny:'special', jester:'special', doctor:'doctor', detective:'detective', mafia:'mafia', shapeshifter:'shapeshifter' };
const roleTheme = r => ROLE_THEME[r] || 'default';
function activateRoleTheme(role) { document.body.dataset.role = roleTheme(role); }
function resetRoleTheme() { document.body.dataset.role = 'default'; }
function resetStory() { chatUnread = 0; chatSeenSig = ''; chatSeenN = 0; chatSeenInit = false; chatDomSig = ''; lastBotHtml = ''; lastTopHtml = ''; chatRestore = null; ghostUnread = 0; ghostSeenN = 0; ghostSeenInit = false; ghostDomSig = ''; ghostRestore = null; soundPhase = ''; soundLog = 0; soundChatN = 0; soundGhostN = 0; chatExpanded = true; ghostExpanded = true; soundPromptKey = ''; soundInit = false; qGen++; Q = []; qBusy = false; seenLog = -1; lastKey = ''; roleShown = false; infoRound = 0; overShown = false; }

function say(text, cls) { Q.push({ text, cls }); if (!qBusy) pump(qGen); }

function pump(g) {
  if (g !== qGen) return;
  const it = Q.shift();
  if (!it) { qBusy = false; return; }
  const st = $('story');
  if (!st) { Q = []; qBusy = false; return; }
  qBusy = true;
  const d = document.createElement('p');
  d.className = 'line ' + (it.cls || '');
  const ws = it.text.split(' ');
  d.innerHTML = ws.map((w, i) => `<span class="w" style="animation-delay:${i * WORD_MS}ms">${esc(w)}</span>`).join(' ');
  st.appendChild(d);
  while (st.children.length > 7) st.removeChild(st.firstChild);
  const nearBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 200;
  if (nearBottom && !/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName)) d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  setTimeout(() => pump(g), ws.length * WORD_MS + 500);
}

function home(msg) {
  cleanup(); V = null; resetStory(); closeOv(); document.body.className = ''; resetRoleTheme();
  clearTimeout(rcTimer);
  const se = loadSession();
  let displaced = false; try { displaced = !!se && sessionStorage.getItem('mafia-displaced') === se.code; } catch(e) {}
  app.innerHTML = `
    <h1>🕵️ MAFIA</h1>
    <p class="sub">Trust no one.</p>
    <div class="card">
      <input id="nm" placeholder="Your Name" maxlength="12">
      <button onclick="create()">Create Room</button>
    </div>
    <div class="card">
      <input id="cd" placeholder="Room Code" maxlength="5" style="text-transform:uppercase">
      <button class="gray" onclick="join()">Join Room</button>
    </div>
    <div class="card">
      <button class="gray" onclick="showHelp('howto')">📖 How to Play</button>
      <button class="gray" onclick="showHelp('whatsnew')">🆕 What's New</button>
      <button class="gray" onclick="showCredits()">🎖️ Credits</button>
    </div>
    ${se && !msg && !noResume && !displaced ? `<div class="card">
       <p class="muted">Last room: <b>${esc(se.code)}</b> (${esc(se.name)})</p>
       <button class="gray" onclick="reconnect()">Reconnect</button></div>` : ''}
    ${msg ? `<div class="alert">${esc(msg)}</div>` : ''}
    ${CREDITS_FOOTER}
  `;
}

function nm() { const n = $('nm').value.trim(); if(!n) { home('Enter a name first'); return null; } return n; }

/* --- HOST LOGIC --- */
const PEER_OPTS = { debug: 1, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } };

function create(retryName) {
  if (busy && !retryName) return;
  const n = retryName || nm(); if (!n) return;
  home('Connecting to server... Please wait (up to 20s).');
  isHost = true; myName = n; busy = true; // must come AFTER home(), which resets them

  code = Math.random().toString(36).slice(2, 7).toUpperCase();
  const s = sess;
  try { peer = new Peer('mafia-mca-' + code, PEER_OPTS); }
  catch (e) { return home('PeerJS library not loaded. Check internet / INTERNET permission.'); }

  let timeout = setTimeout(() => {
    if (s === sess && !G) { home('Could not reach the PeerJS server. Check internet (or try again in a minute, the free server is sometimes busy).'); cleanup(); }
  }, 20000);

  peer.on('open', id => {
    if (s !== sess) return;
    clearTimeout(timeout);
    myId = id;
    G = { phase:'lobby', round:0, opts:{...DEFAULT_OPTS}, players:[{id, name:myName, alive:true, conn:null}], acts:{}, votes:{}, log:[], info:{}, chat:[], chatN:0, ghost:[], ghostN:0 };
    push();
  });

  peer.on('connection', c => {
    c.on('data', d => { if (s === sess && G) hostMsg(c, d); });
    c.on('close', () => { if (s === sess && G) { const p = G.players.find(x => x.conn === c); if (p) onDisconnect(p); } });
  });

  peer.on('disconnected', () => { if (s === sess && peer && !peer.destroyed) { try { peer.reconnect(); } catch(e) {} } });

  peer.on('error', e => {
    clearTimeout(timeout);
    if (s !== sess) return;
    if (e.type === 'unavailable-id') { const nn = myName; try { peer.destroy(); } catch(x) {} create(nn); }
    else if (!G) home('Server error: ' + e.type + '. Check internet and try again.');
  });
}

function hostMsg(c, d) {
  if (d.t === 'join') {
    const token = String(d.token || '').slice(0, 64);
    const ex = token && G.players.find(p => p.token === token && !p.gone);
    if (ex) {   // reconnect: keep the ORIGINAL id/slot (ex.id stays the old peer id on purpose; votes, acts and the view all key off it)
      const old = ex.conn;
      ex.conn = c; ex.dcAt = null;
      if (G.auto && G.auto[ex.id]) {   // let them still act this round
        if (G.phase === 'night' && G.acts[ex.id] === null) delete G.acts[ex.id];
        if ((G.phase === 'day' || G.phase === 'retrial') && G.votes[ex.id] === 'skip') delete G.votes[ex.id];
        delete G.auto[ex.id];
      }
      if (old && old !== c) {
        try { old.send({t:'replaced'}); } catch(e) {}
        setTimeout(() => { try { old.close(); } catch(e) {} }, 200);
      }
      if (G.phase === 'night' || G.phase === 'day' || G.phase === 'shapeshift') G.log.push('✅ ' + publicName(ex) + ' reconnected.');
      push(); return;
    }
    const removed = token && G.players.find(p => p.token === token && p.gone);
    if (removed && G.phase !== 'lobby') return c.send({t:'err', m: removed.kicked ? 'You were kicked by the host.' : 'You were removed from this game (disconnected too long).'});
    if (G.phase !== 'lobby') return c.send({t:'err', m:'Game already started'});
    if (G.players.length >= 15) return c.send({t:'err', m:'Room is full'});
    const base = String(d.name || '').trim().slice(0, 12) || 'Player';
    let n = base, i = 1;
    while (G.players.some(p => p.name === n)) { const suf = String(i++); n = base.slice(0, Math.max(1, 12 - suf.length)) + suf; if (i > 200) return c.send({t:'err', m:'Room is full'}); }
    G.players.push({ id: c.peer, name: n, alive: true, conn: c, token: token || null });
    push(); return;
  }
  const p = G.players.find(p => p.conn === c);
  if (!p) return;
  if (d.t === 'leave') return leave(p);
  act(p, d);
}

function onDisconnect(p) {
  if (p.gone || !G.players.includes(p) || !p.conn) return;
  p.conn = null;
  p.dcAt = Date.now();
  if (p.alive && !p.kicked) G.log.push('⏳ ' + publicName(p) + ' disconnected, waiting up to 2 min for reconnect...');
  autoResolve(p);
  if (G.phase === 'night' && nightDone()) return resolveNight();
  if (G.phase === 'day' && !waitingVoters().length) return resolveVote();
  if (G.phase === 'retrial' && !waitingVoters().length) return resolveRetrial();
  push();
}
function isSilenced(id) { return !!(G.silenced && G.silenced[id] === G.round); }
function waitingVoters() { return G.players.filter(x => x.alive && !(x.id in G.votes) && !isSilenced(x.id)); }
function autoResolve(p) {   // a disconnect must not stall night/vote
  G.auto = G.auto || {};
  if (G.phase === 'night' && needsAct(p) && !(p.id in G.acts)) { G.acts[p.id] = null; G.auto[p.id] = 1; }
  if ((G.phase === 'day' || G.phase === 'retrial') && p.alive && !(p.id in G.votes) && !isSilenced(p.id)) { G.votes[p.id] = 'skip'; G.auto[p.id] = 1; }
}

function leave(p, reason) {
  if (p.gone || !G.players.includes(p)) return; p.gone = true; // avoid double-handling (leave msg + conn close)
  if (G.phase === 'lobby' || G.phase === 'over') {
    G.players = G.players.filter(x => x !== p);
    if (p.conn) try { p.conn.close(); } catch(e) {}
    return push();
  }
  if (G.phase === 'shapeshift' && p.id === G.ssId) return shiftTimeout();
  const wasAlive = p.alive;
  p.alive = false;
  if (wasAlive) G.log.push(p.kicked ? '👢 ' + publicName(p) + ' was kicked by the host.'
    : reason === 'timeout' ? '🚪 ' + publicName(p) + ' did not reconnect in time.'
    : '🚪 ' + publicName(p) + ' left the game.');
  if (win()) return;
  if (G.phase === 'judge' && p.id === G.judgeId) return judgeResponse(false);
  if (G.phase === 'rebel' && p.id === G.rebelId) { G.rebelId = null; G.deadline = null; return startNight(); }
  if (G.phase === 'night' && nightDone()) resolveNight();
  else if (G.phase === 'day' && !waitingVoters().length) resolveVote();
  else if (G.phase === 'retrial' && !waitingVoters().length) resolveRetrial();
  else push();
}

function leaveRoom() {
  if (!confirm('Leave the room?')) return;
  clearSession();
  sess++;   // blocks stale close/data handlers
  if (isHost) { G.players.forEach(p => { if(p.conn) try{p.conn.send({t:'end'})}catch(e){} }); isHost = false; setTimeout(()=>home('You ended the room.'), 200); }
  else { try{hostConn.send({t:'leave'})}catch(e){}; setTimeout(()=>home('You left.'), 200); }
}

function kick(id) {
  if (!isHost || !G) return;
  const p = G.players.find(x => x.id === id && x !== G.players[0]);
  if (!p) return;
  p.kicked = true; // flag first, so the close event is also logged as a kick
  const c = p.conn;
  if (c) try { c.send({t:'kicked'}); } catch(e) {}
  setTimeout(() => { if (G && G.players.includes(p)) leave(p); if (c) try { c.close(); } catch(e) {} }, 250);
}

function send(d) {
  if (d.t === 'vote' || d.t === 'judge' || d.t === 'rebel') SFX.click();
  else if (d.t === 'act' || d.t === 'oracle' || d.t === 'shapeshift' || d.t === 'oraclePass') SFX.yourTurn();
  if (isHost) act(G.players[0], d); else if (hostConn) { try { hostConn.send(d); } catch(e) {} } }

/* --- GAME ACTIONS --- */
function act(p, d) {
  if (d.t === 'opt' && G.phase === 'lobby' && p === G.players[0]) {
    if (d.k === 'time') { if (TIMES.includes(+d.val)) { G.opts.time = +d.val; push(); } return; }
    if (OPTIONAL_ROLES.includes(d.k)) { G.opts[d.k] = !!d.val; push(); }
    return;
  }
  if (d.t === 'ghost' && G.phase !== 'lobby' && !p.alive && p.role) {   // eliminated by game logic (killed / voted out); a disconnect never sets alive=false
    const text = String(d.text || '').trim().slice(0, 120); if (!text) return;
    G.ghost = G.ghost || []; G.ghost.push(`${ROLES[p.role][2]} ${publicName(p)} (${ROLES[p.role][0]}): ${text}`);
    G.ghostN = (G.ghostN || 0) + 1;
    if (G.ghost.length > 50) G.ghost.shift();
    return push();
  }
  if (d.t === 'chat' && (G.phase === 'lobby' || G.phase === 'day' || G.phase === 'retrial' || (['shapeshift', 'judge', 'rebel'].includes(G.phase) && !prompted(p))) && p.alive) {
    G.chat.push(publicName(p) + ': ' + String(d.text).slice(0, 120));
    G.chatN = (G.chatN || 0) + 1;   // monotonic: never reset, so clients can count arrivals exactly even at the 30-cap
    if (G.chat.length > 30) G.chat.shift();
    return push();
  }
  if (d.t === 'oracle' && G.phase === 'night' && needsAct(p) && p.role === 'oracle' && !(p.id in G.acts)) {
    const a = G.players.find(x => x.id === d.a && x.alive), b = G.players.find(x => x.id === d.b && x.alive);
    if (!a || !b || a === b) return;
    p.oracleUsed = true; G.acts[p.id] = a.id;
    G.info[p.id] = '🔮 ' + publicName(a) + ' & ' + publicName(b) + ': ' + (isM(a.role) === isM(b.role) ? 'SAME FACTION' : 'DIFFERENT FACTIONS');
    if (nightDone()) resolveNight(); else push();
    return;
  }
  if (d.t === 'oraclePass' && G.phase === 'night' && needsAct(p) && p.role === 'oracle' && !(p.id in G.acts)) {
    G.acts[p.id] = null;
    if (nightDone()) resolveNight(); else push();
    return;
  }
  if (d.t === 'judge' && G.phase === 'judge' && p.id === G.judgeId) return judgeResponse(!!d.call);
  if (d.t === 'rebel' && G.phase === 'rebel' && p.id === G.rebelId) return rebelResponse(!!d.refuse);
  if (d.t === 'act' && G.phase === 'night' && needsAct(p) && p.role !== 'oracle' && !(p.id in G.acts)) {
    const t = G.players.find(x => x.id === d.target && x.alive);
    if (!t) return;
    if (p.role === 'guard' && t === p) return;
    if (isM(p.role) && isM(t.role)) return;
    if (p.role === 'detective' && t === p) return;
    G.acts[p.id] = t.id;
    if (p.role === 'detective') G.info[p.id] = publicName(t) + ' is ' + (isM(t.role) ? 'MAFIA 🔪' : 'NOT Mafia ✅');
    if (nightDone()) resolveNight(); else push();
    return;
  }
  if (d.t === 'shapeshift' && G.phase === 'shapeshift' && p.id === G.ssId) {
    const t = G.players.find(x => x.id === d.target && x.alive && isM(x.role) && x.id !== p.id);
    if (!t) return;
    const tmp = p.displayName; p.displayName = t.displayName; t.displayName = tmp;   // swap names
    t.alive = false; p.canShift = false;                                            // once per game
    G.ssId = null; G.deadline = null;
    G.log.push('🗳️ The town has spoken. ' + publicName(t) + ' was voted out. They were ' + ROLES[t.role][0] + '.');
    if (!win()) startNight();
    return;
  }
  if (d.t === 'vote' && (G.phase === 'day' || G.phase === 'retrial') && p.alive && !isSilenced(p.id) && !(p.id in G.votes)) {
    let v = d.target;
    if (G.phase === 'retrial' && !(G.tieIds || []).includes(v)) return;   // retrial: only the two candidates, no skip
    if (v !== 'skip') { const t = G.players.find(x => x.id === d.target && x.alive && x !== p); if (!t) return; }
    G.votes[p.id] = v;
    if (!waitingVoters().length) { if (G.phase === 'retrial') resolveRetrial(); else resolveVote(); } else push();
  }
}

function start() {
  if (G.phase !== 'lobby') return;
  const ghosts = G.players.filter(p => p !== G.players[0] && !p.conn).length;
  if (ghosts) return alert(ghosts + ' player(s) are disconnected or reconnecting. Wait for them or kick them first.');
  const n = G.players.length;
  if (n < 5) return alert('Need at least 5 players!');
  const mc = Math.max(1, Math.floor((n - 1) / 3));
  const roles = Array(mc).fill('mafia');
  if (G.opts.shapeshifter && mc >= 2) roles[mc - 1] = 'shapeshifter';   // needs another Mafia to swap with
  OPTIONAL_ROLES.forEach(r => { if (r !== 'shapeshifter' && G.opts[r] && roles.length < n) roles.push(r); });
  while (roles.length < n) roles.push('civilian');
  for (let i = roles.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [roles[i], roles[j]] = [roles[j], roles[i]]; }
  G.players.forEach((p, i) => { p.role = roles[i]; p.alive = true; p.displayName = p.name; p.canShift = p.role === 'shapeshifter'; p.judgeUsed = p.rebelUsed = p.oracleUsed = false; });
  G.ssId = G.judgeId = G.rebelId = G.tieIds = null; G.silenced = {};
  G.round = 0; G.winner = null; G.log = ['The game begins.']; G.chat = []; G.ghost = [];
  startNight();
}

function startNight() {
  G.phase = 'night'; G.round++; G.acts = {}; G.votes = {}; G.info = {}; G.chat = []; G.auto = {}; G.deadline = Date.now() + NIGHT_MS;
  const dcs = G.players.filter(p => p.dcAt);
  if (dcs.length) { dcs.forEach(autoResolve); if (nightDone()) return resolveNight(); }
  push();
}

const nightDone = () => G.players.filter(needsAct).every(p => p.id in G.acts);

function resolveNight() {
  const maf = G.players.filter(p => p.alive && isM(p.role)), cnt = {};
  maf.forEach(m => { const t = G.acts[m.id]; if (t) cnt[t] = (cnt[t] || 0) + 1; });
  const vals = Object.values(cnt);
  const top = vals.length ? Math.max(...vals) : 0;
  const tops = vals.length ? Object.keys(cnt).filter(k => cnt[k] === top) : [];
  const tid = tops.length ? tops[Math.floor(Math.random() * tops.length)] : null;
  const tg = G.players.find(p => p.id === tid);
  const doc = G.players.find(p => p.alive && p.role === 'doctor');
  const gd = G.players.find(p => p.alive && p.role === 'guard');
  const saved = (doc && tid && G.acts[doc.id] === tid) || (gd && tid && G.acts[gd.id] === tid);

  let msg = '';
  if (tg && tg.role === 'granny') {
    const ks = maf.filter(m => G.acts[m.id] === tid); ks.forEach(k => k.alive = false);
    msg = '🌅 The sun rises. The mafia attacked Granny... and ' + ks.map(publicName).join(', ') + (ks.length > 1 ? ' (all Mafia) were' : ' (Mafia) was') + ' killed instead!';
  } else if (saved) {
    msg = '🌅 The sun rises. The mafia struck, but the victim was protected. Nobody died.';
  } else if (tg) {
    tg.alive = false; msg = '🌅 The sun rises. ' + publicName(tg) + ' was found dead. They were ' + ROLES[tg.role][0] + '.';
  } else { msg = '🌅 The sun rises on a quiet night.'; }

  G.log.push(msg); G.acts = {}; G.votes = {}; G.auto = {}; G.phase = 'day'; G.deadline = Date.now() + G.opts.time * 1000;
  if (!win()) push();
}

function tally(only) {   // weighted: Mayor's vote for a player counts 2; silenced/dead voters count 0
  const cnt = {};
  Object.entries(G.votes).forEach(([voter, target]) => {
    const vp = G.players.find(p => p.id === voter);
    if (!vp || !vp.alive || isSilenced(voter)) return;
    if (target !== 'skip' && !G.players.some(p => p.id === target && p.alive)) return;
    if (only && !only.includes(target)) return;
    cnt[target] = (cnt[target] || 0) + (vp.role === 'mayor' && target !== 'skip' ? 2 : 1);
  });
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]);
}

function resolveVote() {
  G.deadline = null;
  const s = tally();
  if (!s.length || s[0][0] === 'skip') { G.log.push('🗳️ No majority. Nobody was voted out.'); return win() ? 0 : startNight(); }
  if (s[1] && s[1][1] === s[0][1]) {
    const exactTwo = s[1][0] !== 'skip' && (!s[2] || s[2][1] < s[0][1]);
    const judge = G.players.find(p => p.alive && p.role === 'judge' && !p.judgeUsed);
    if (exactTwo && judge) { G.phase = 'judge'; G.judgeId = judge.id; G.tieIds = [s[0][0], s[1][0]]; G.deadline = Date.now() + JUDGE_MS; return push(); }
    G.log.push('🗳️ No majority. Nobody was voted out.'); return win() ? 0 : startNight();
  }
  execute(G.players.find(p => p.id === s[0][0]));
}

function execute(t) {   // the town has chosen t
  if (!t) { G.log.push('🗳️ Nobody was voted out.'); return win() ? 0 : startNight(); }
  if (t.role === 'rebel' && !t.rebelUsed) { G.phase = 'rebel'; G.rebelId = t.id; G.deadline = Date.now() + REBEL_MS; return push(); }
  if (t.role === 'shapeshifter' && t.canShift && G.players.some(x => x.alive && x.id !== t.id && isM(x.role))) {
    G.phase = 'shapeshift'; G.ssId = t.id; G.deadline = Date.now() + 20000;   // town just sees 'counting votes'
    return push();
  }
  finishExecute(t);
}
function finishExecute(t) {
  t.alive = false;
  G.log.push('🗳️ The town has spoken. ' + publicName(t) + ' was voted out. They were ' + ROLES[t.role][0] + '.');
  if (t.role === 'jester') { G.phase = 'over'; G.winner = 'Jester'; G.deadline = null; return push(); }
  if (!win()) startNight();
}
function judgeResponse(call) {
  const j = G.players.find(p => p.id === G.judgeId), tie = G.tieIds;
  G.judgeId = null; G.deadline = null;
  // declined/timed out: judgeUsed stays false on purpose (use it only if you activate it), so a later tie can prompt again
  if (!call || !j) { G.tieIds = null; G.log.push('🗳️ No majority. Nobody was voted out.'); return win() ? 0 : startNight(); }
  j.judgeUsed = true;
  G.phase = 'retrial'; G.votes = {}; G.auto = {}; G.deadline = Date.now() + G.opts.time * 1000;
  G.log.push('⚖️ A retrial has been called between ' + tie.map(id => publicName(G.players.find(p => p.id === id))).join(' and ') + '.');
  if (!waitingVoters().length) return resolveRetrial();
  push();
}
function resolveRetrial() {
  G.deadline = null;
  const s = tally(G.tieIds);
  G.tieIds = null;
  if (!s.length) { G.log.push('⚖️ The retrial ended with no votes. Nobody was voted out.'); return win() ? 0 : startNight(); }
  if (s[1] && s[1][1] === s[0][1]) { G.log.push('⚖️ The retrial is tied. Nobody was voted out.'); return win() ? 0 : startNight(); }
  execute(G.players.find(p => p.id === s[0][0]));
}
function rebelResponse(refuse) {
  const t = G.players.find(p => p.id === G.rebelId);
  G.rebelId = null; G.deadline = null;
  if (!t) return win() ? 0 : startNight();
  t.rebelUsed = true;   // the ability is spent either way
  if (refuse) {
    G.silenced = G.silenced || {}; G.silenced[t.id] = G.round + 1;   // loses the next day's vote
    G.log.push('🗳️ The execution of ' + publicName(t) + ' was cancelled. Nobody was voted out.');
    return startNight();
  }
  finishExecute(t);
}

function shiftTimeout() {   // shapeshifter didn't pick (or left): dies normally
  const t = G.players.find(x => x.id === G.ssId);

function win() {
  const a = G.players.filter(p => p.alive), m = a.filter(p => isM(p.role)).length;

function again() {

/* --- CLIENT LOGIC --- */
let rcTimer = null, rcTries = 0, rcStart = 0, noResume = false;
const rcExpired = () => Date.now() - rcStart > GRACE_MS + 10000;
function join(codeArg, nameArg, isReconnect) {
  if (busy && !isReconnect) return;
  let n, c;
  if (isReconnect && codeArg && nameArg) { n = nameArg; c = codeArg; }
  else {
    n = nm(); if (!n) return;
    c = $('cd').value.trim().toUpperCase(); if (!c) return home('Enter room code');
  }
  if (isReconnect) cleanup(); else home('Connecting to room ' + c + '...');
  busy = true; code = c; myName = n;

  const s = sess;
  try { peer = new Peer(PEER_OPTS); }
  catch (e) { return home('PeerJS library not loaded. Check internet / INTERNET permission.'); }

  let timeout = setTimeout(() => {
    if (s !== sess) return;
    if (isReconnect) reconnectScreen('Could not reach host. Retrying…');
    else { home('Connection timed out. Check the code and your internet.'); cleanup(); }
  }, 20000);

  peer.on('open', id => {
    if (s !== sess) return; myId = id;
    hostConn = peer.connect('mafia-mca-' + c, { reliable: true });
    hostConn.on('open', () => {
      hostConn.send({t:'join', name:n, token:getToken()});
      saveSession(c, n);
    });
    hostConn.on('data', d => {
      if (s !== sess) return;
      if (d.t === 'v') { clearTimeout(timeout); try { sessionStorage.removeItem('mafia-displaced'); } catch(e) {} rcTries = 0; clearTimeout(rcTimer); V = d.v; render(); }
      else if (d.t === 'err') { clearSession(); home(d.m); }
      else if (d.t === 'end') { clearSession(); home('Host ended the game.'); }
      else if (d.t === 'kicked') { clearSession(); home('You were kicked by the host.'); }
      else if (d.t === 'replaced') { noResume = true; try { sessionStorage.setItem('mafia-displaced', c); } catch(e) {} home('You joined from another tab or device, so this one was disconnected.'); }
    });
    hostConn.on('close', () => { if (s === sess) reconnectScreen('Connection lost. Reconnecting…'); });
  });

  peer.on('disconnected', () => {
    if (s === sess && peer && !peer.destroyed) { try { peer.reconnect(); } catch(e) {} }
  });

  peer.on('error', e => {
    clearTimeout(timeout); if (s !== sess) return;
    const m = e.type === 'peer-unavailable' ? 'Room not found. Check the code.' : 'Network error: ' + e.type;
    if (isReconnect) reconnectScreen(m); else { clearSession(); home(m); }
  });
}

function reconnectScreen(msg) {
  cleanup(); V = null; resetStory(); closeOv();
  clearTimeout(rcTimer);
  const se = loadSession();
  if (!se) return home('Disconnected from room.');
  if (rcTries > 0 && rcExpired()) { clearSession(); return home('Could not reconnect. Session ended.'); }
  if (rcTries === 0) rcStart = Date.now();
  rcTries++;
  document.body.className = '';
  app.innerHTML = `
    <h1>🕵️ MAFIA</h1>
    <p class="sub">${esc(msg || 'Reconnecting…')}</p>
    <div class="card">
      <p class="muted">Room <b>${esc(se.code)}</b> · attempt ${rcTries}</p>
      <button onclick="reconnect()">Reconnect now</button>
      <button class="gray" onclick="rcLeave()">Leave room</button>
    </div>`;
  if (!rcExpired()) rcTimer = setTimeout(rcRetry, 3000);
}
function rcRetry() {
  clearTimeout(rcTimer);
  const se = loadSession();
  if (!se) return home('No room to reconnect to.');
  if (rcExpired()) { clearSession(); return home('Could not reconnect. Session ended.'); }
  join(se.code, se.name, true);
}
function rcLeave() { clearTimeout(rcTimer); clearSession(); home('You left the room.'); }
function reconnect() { noResume = false; rcTries = 0; rcStart = Date.now(); rcRetry(); }

/* SOUND DRIVER: called from render(), plays on state transitions */
function driveSounds(v) {
  if (v.phase !== soundPhase) {
    if (v.phase === 'night') SFX.night();
    else if (v.phase === 'day') SFX.day();
    else if (v.phase === 'over') {
      const youWin =
        (v.winner === 'Mafia' && isM(v.you.role)) ||
        (v.winner === 'Civilians' && !isM(v.you.role) && v.you.role !== 'jester') ||
        (v.winner === 'Jester' && v.you.role === 'jester');
      youWin ? SFX.win() : SFX.lose();
    }
    soundPhase = v.phase;
  }
  const absoluteEnd = v.logBase + v.log.length;
  if (soundInit && absoluteEnd > soundLog) {
    const newLogs = v.log.slice(Math.max(0, soundLog - v.logBase));
    let playedKill = false, playedSave = false;
    newLogs.forEach(l => {
      if (/found dead|was voted out|mafia attacked/.test(l)) { if (!playedKill) { SFX.kill(); playedKill = true; } }
      else if (/victim was protected/.test(l)) { if (!playedSave) { SFX.save(); playedSave = true; } }
      else if (/reconnected/.test(l)) SFX.ping();
    });
  }
  soundLog = absoluteEnd;
  const cn = v.chatN || 0;
  if (soundInit && v.chat.length && cn !== soundChatN) SFX.ping();
  soundChatN = cn;
  const gn = v.ghostN || 0;
  if (soundInit && v.ghost.length && gn !== soundGhostN) SFX.ping();
  soundGhostN = gn;
  let promptKey = '';
  if (v.phase === 'judge' || v.phase === 'rebel' || v.phase === 'shapeshift') promptKey = v.phase + ':' + ((v.tie || []).join(','));
  else if (v.need) promptKey = v.phase + ':' + v.need;
  if (promptKey && promptKey !== soundPromptKey) SFX.yourTurn();
  soundPromptKey = promptKey;
  soundInit = true;
}

      if (v.host) h += '<button onclick="again()">Play Again</button>';
    }
    if (v.phase === 'night') {
      if (v.need === 'act' && v.you.role === 'oracle') {
        h += `<p style="margin-top:8px">Pick two players to compare (${oraSel.length}/2):</p><div class="grid">` + v.players.filter(p => p.alive).map(p => `<button class="${oraSel.includes(p.id) ? 'sel' : ''}" onclick="oraPick('${p.id}')">${av(p.name)}${esc(p.name)}</button>`).join('') + `</div>`;
        if (oraSel.length === 2) h += `<button class="act" onclick="oraGo()">🔮 Reveal</button>`;
        h += `<button class="gray" onclick="send({t:'oraclePass'})">Not tonight</button>`;
      }
      else if (v.need === 'act') h += `<p style="margin-top:8px">${isM(v.you.role)?'Choose a victim':v.you.role==='doctor'?'Choose who to save':v.you.role==='guard'?'Choose who to protect':'Choose who to investigate'}:</p>` + btns(v, 'act');
      else h += '<p class="muted" style="margin-top:8px">Waiting for others... 😴</p>';
    }
    if (v.phase === 'day' || v.phase === 'retrial') {
      h += chatHTML(v);
      if (v.silenced && v.you.alive) h += `<p class="muted" style="margin-top:12px">✊ You are silenced today. You cannot vote.</p>`;
      if (v.need === 'vote') h += `<p style="margin-top:12px">${v.tie ? '⚖️ Retrial: vote for one of the two' : 'Cast your vote'}:</p>` + btns(v, 'vote');
      else if (v.counting) h += `<p class="muted" style="margin-top:10px">🗳️ Counting the votes...</p>`;
      else if (v.voted) h += `<p class="muted" style="margin-top:10px">Vote cast. Waiting for ${v.waiting}...</p>`;
    }
    if (v.phase === 'judge') {
      const nm2 = v.tie.map(id => (v.players.find(p => p.id === id) || {}).name).join(' and ');
      h += `<div class="prompt-card"><h3>⚖️ Tie: ${esc(nm2)}</h3><p>Call a retrial between them? (once per game)</p><button onclick="send({t:'judge',call:true})">Call retrial</button><button class="gray" onclick="send({t:'judge',call:false})">No retrial</button></div>`;
    }
    if (v.phase === 'rebel') {
      h += `<div class="prompt-card rebel"><h3>✊ You are about to be executed!</h3><p>Refuse? You survive, but lose your next day vote. (once per game)</p><button onclick="send({t:'rebel',refuse:true})">Refuse execution</button><button class="gray" onclick="send({t:'rebel',refuse:false})">Accept fate</button></div>`;
    }
    if (v.phase === 'shapeshift') {
      h += `<p style="margin-top:12px;color:var(--role-accent);font-weight:600">You were voted out! Choose a Mafia to die in your place (name swap):</p>` + btns(v, 'shapeshift');
    }
  }
  h += ghostHTML(v);
  h += `<div class="players">${v.players.map(p => { const showRole = p.role && (!p.alive || v.phase === 'over' || (p.role === 'mafia' && isM(v.you.role))); return `<div class="pc ${p.alive?'':'dead'}" ${v.host && p.id !== v.you.id && p.alive ? 'data-id="' + esc(p.id) + '"' : ''}>${av(p.name)}<div><span class="nm">${esc(p.name)}</span>${p.dc && p.alive ? '<small>⏳ reconnecting…</small>' : showRole ? `<small class="rl" data-rt="${roleTheme(p.role)}">${ROLES[p.role][2]} ${ROLES[p.role][0]}</small>` : ''}</div>${p.vt == null ? '' : `<span class="vdot ${p.vt ? 'yes' : 'no'}" role="img" aria-label="${p.vt ? 'voted' : 'has not voted'}" title="${p.vt ? 'Voted' : 'Has not voted yet'}"></span>`}</div>`; }).join('')}</div>`;
  if (v.host && v.players.length > 1) h += '<p class="muted" style="margin-top:10px;text-align:center">Host: hold a player to kick them.</p>';
  h += `<button class="gray" style="margin-top:20px" onclick="leaveRoom()">${v.host?'End Game':v.phase==='over'?'Return to Menu':'Leave Room'}</button>`;
  if (h !== lastBotHtml) {   // rebuild only when the markup really changed
    const oi = $('chatInput'), val = oi ? oi.value : '', hadFocus = oi && document.activeElement === oi;
    const ob = $('chatMessages'), op = $('chatNewBtn');
    chatRestore = (ob && chatExpanded && chatDomSig !== '') ? { top: ob.scrollTop, bottom: ob.scrollTop + ob.clientHeight >= ob.scrollHeight - 5, pill: !!op && !op.classList.contains('hidden') } : null;
    const gi = $('ghostInput'), gval = gi ? gi.value : '', gFocus = gi && document.activeElement === gi;
    const gb = $('ghostMessages'), gp = $('ghostNewBtn');
    ghostRestore = (gb && ghostExpanded && ghostDomSig !== '') ? { top: gb.scrollTop, bottom: gb.scrollTop + gb.clientHeight >= gb.scrollHeight - 5, pill: !!gp && !gp.classList.contains('hidden') } : null;
    $('bot').innerHTML = h; lastBotHtml = h; chatDomSig = ''; ghostDomSig = '';
    const ni = $('chatInput'); if (ni && val) { ni.value = val; if (hadFocus) ni.focus(); }
    const ngi = $('ghostInput'); if (ngi && gval) { ngi.value = gval; if (gFocus) ngi.focus(); }
  }
  renderChatMessages(v);
  renderGhostMessages(v);
}


function updTimer() {
  const e = $('tm'); if (!e) return;
  if (!V || !['day', 'night', 'shapeshift', 'judge', 'rebel', 'retrial'].includes(V.phase) || !endAt || V.counting || (V.phase === 'night' && !V.you.alive)) { e.textContent = ''; return; }
  const s = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  e.textContent = '⏱ ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  e.className = 'tm' + (s <= 10 ? ' low' : '');
}
setInterval(() => {
  updTimer();
  if (isHost && G) {
    const now = Date.now();
    G.players.filter(p => p.dcAt && now - p.dcAt > GRACE_MS && p !== G.players[0])
              .forEach(p => { p.dcAt = null; leave(p, 'timeout'); });
    if (G && G.phase === 'shapeshift' && G.deadline && now >= G.deadline) shiftTimeout();
    if (G && G.phase === 'retrial' && G.deadline && now >= G.deadline) resolveRetrial();
    if (G && G.phase === 'judge' && G.deadline && now >= G.deadline) judgeResponse(false);
    if (G && G.phase === 'rebel' && G.deadline && now >= G.deadline) rebelResponse(false);
    if (G && G.phase === 'night' && G.deadline && now >= G.deadline) {   // idle players are skipped
      G.players.forEach(p => { if (needsAct(p) && !(p.id in G.acts)) G.acts[p.id] = null; });
      G.deadline = null; resolveNight();
    }
    // host ends the vote when time runs out (players who didn't vote count as abstaining)
    if (G && G.phase === 'day' && G.deadline && Date.now() >= G.deadline) resolveVote();
  }
}, 500);

function closeOv() { const o = $('ov'); if (o) o.remove(); }
function kickMenu(id) {
  const p = V && V.players.find(x => x.id === id);
  if (!p || !isHost) return;
  closeOv();
  const o = document.createElement('div'); o.id = 'ov';
  o.innerHTML = `<div class="card"><h3>${esc(p.name)}</h3><button id="kk">👢 Kick player</button><button class="gray" id="kc">Cancel</button></div>`;
  const opened = Date.now();
  o.onclick = e => { if (e.target === o && Date.now() - opened > 500) closeOv(); };
  o.querySelector('#kk').onclick = () => { kick(id); closeOv(); };
  o.querySelector('#kc').onclick = closeOv;
  document.body.appendChild(o);
}
function lpStart(e) {
  const el = e.target.closest && e.target.closest('.pc[data-id]');
  if (!el || !isHost || !V) return;
  clearTimeout(lpT);
  const id = el.dataset.id;
  lpT = setTimeout(() => kickMenu(id), 600);
}
function lpEnd() { clearTimeout(lpT); }
document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const oc = btn.getAttribute('onclick') || '';
  if (btn.closest('.grid') || /oraGo|oraclePass|'judge'|'rebel'|chatSend|ghostSend/.test(oc)) return;   // these already sound via send() / the chat ping
  SFX.click();
}, { passive: true });
['touchstart', 'mousedown'].forEach(ev => app.addEventListener(ev, lpStart, { passive: true }));
['touchend', 'touchmove', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => app.addEventListener(ev, lpEnd, { passive: true }));
app.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.pc[data-id]')) e.preventDefault(); });

home();
</script>
</body>
</html>
