<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mafia Multiplayer</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Georgia, 'Times New Roman', serif; -webkit-tap-highlight-color: transparent; }
  :root { --bg1:#0b0d16; --bg2:#1a1030; --accent:#c0392b; --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.1); --txt:#ece9f5; --mut:#8c8aa3; }
  body.day { --bg1:#2a2438; --bg2:#5a3d4a; --accent:#e08a2c; }
  body.over { --bg1:#0f1a14; --bg2:#26402f; --accent:#d4af37; }
  html, body { min-height: 100%; }
  body { background: radial-gradient(ellipse at 50% -10%, var(--bg2), var(--bg1) 70%) fixed; color: var(--txt); padding: 16px; display: flex; justify-content: center; transition: background 1.5s; }
  .app { width: 100%; max-width: 480px; padding-bottom: 30px; }
  h1 { font-size: 30px; text-align: center; letter-spacing: 2px; margin: 24px 0 4px; }
  .sub { text-align: center; color: var(--mut); font-style: italic; margin-bottom: 18px; }
  h2, h3 { margin-bottom: 10px; letter-spacing: 1px; }
  input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: #fff; font-size: 16px; outline: none; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; padding: 14px; margin: 6px 0; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform .1s, filter .2s; }
  button:active { transform: scale(.97); filter: brightness(1.2); }
  button.gray { background: rgba(255,255,255,.12); }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin: 12px 0; border: 1px solid var(--line); backdrop-filter: blur(6px); animation: rise .6s both; }
  .muted { color: var(--mut); font-size: 14px; }
  .alert { background: rgba(192,57,43,.15); border: 1px solid var(--accent); color: #ffb3a8; padding: 12px; border-radius: 10px; margin: 10px 0; font-size: 14px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .code { font-size: 22px; letter-spacing: 4px; font-weight: bold; }
  .pill { background: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; transition: background 1.5s; }
  .role { display: flex; gap: 14px; align-items: center; }
  .role .em { font-size: 40px; filter: drop-shadow(0 0 12px var(--accent)); }
  .role b { font-size: 20px; }
  #story { margin: 14px 0; min-height: 10px; }
  .line { margin: 10px 0; font-size: 17px; line-height: 1.55; }
  .line.phase { font-size: 19px; font-style: italic; color: #fff; text-shadow: 0 0 14px var(--accent); }
  .line.role, .line.info { color: #ffd98a; }
  .w { opacity: 0; display: inline-block; animation: fadeWord .7s forwards; }
  @keyframes fadeWord { from { opacity: 0; transform: translateY(4px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .chat { background: rgba(0,0,0,.3); border-radius: 10px; padding: 10px; min-height: 90px; max-height: 190px; overflow-y: auto; margin-bottom: 8px; font-size: 14px; }
  .chat div { margin-bottom: 4px; animation: rise .3s both; }
  .row { display: flex; gap: 8px; }
  .row button { width: auto; padding: 0 20px; margin: 0; }
  .row input { margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .grid button { display: flex; align-items: center; gap: 8px; text-align: left; background: var(--card); border: 1px solid var(--line); font-weight: normal; margin: 0; animation: rise .5s both; }
  .grid button.skip { grid-column: 1 / -1; justify-content: center; }
  .av { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; flex: none; }
  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .pc { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 14px; animation: rise .5s both; }
  .pc small { display: block; color: var(--mut); font-size: 11px; }
  .pc.dead { opacity: .45; } .pc.dead .nm { text-decoration: line-through; } .pc.dead .av { background: #444; }
  .win { text-align: center; font-size: 22px; }
  .chk { display:flex; align-items:flex-start; gap:10px; padding:8px 0; font-size:15px; cursor:pointer; border-bottom:1px solid var(--line); }
  .chk:last-child { border-bottom:0; }
  .chk input { width:18px; height:18px; margin:2px 0 0; padding:0; flex:none; accent-color: var(--accent); border:0; background:none; border-radius:0; }
  .chk small { display:block; color:var(--mut); font-size:12px; font-style:italic; }
  .chk.off { opacity:.4; }
  select { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,.35); color:#fff; font-size:16px; }
  .tm { font-weight:bold; margin-right:8px; font-size:15px; }
  .tm.low { color:#ff6b5b; animation:pulse .8s infinite alternate; }
  @keyframes pulse { to { opacity:.4; } }
  .pc { user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #ov { position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  #ov .card { max-width:340px; width:100%; background:#1b1530; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const $ = id => document.getElementById(id);
const app = $('app');

const ROLES = {
  mafia: ['Mafia', 'Kill one player each night.', '🔪'],
  granny: ['Granny', 'If mafia picks you, the mafia dies instead.', '👵'],
  doctor: ['Doctor', 'Save one player each night.', '💉'],
  detective: ['Detective', 'Investigate one player each night.', '🕵️'],
  civilian: ['Civilian', 'Find the mafia and vote them out.', '🧑‍🌾']
};
ROLES.jester = ['Jester', 'Get voted out during the day to win the game.', '🤡'];
const ACTIVE_ROLES = ['mafia', 'doctor', 'detective'];
const OPTIONAL_ROLES = ['doctor', 'detective', 'granny', 'jester'];
const DEFAULT_OPTS = { doctor: true, detective: true, granny: true, jester: false, time: 90 };
const TIMES = [45, 60, 90, 120, 180]; // day voting time options (seconds)
const WORD_MS = 140; // typing speed: lower = faster

let endAt = 0, lpT = null;
let peer, isHost = false, myId, myName, hostConn, G = null, V = null, code = '', sess = 0, busy = false;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function cleanup() {
  sess++; busy = false;
  try { if (peer) peer.destroy(); } catch(e) {}
  peer = null; hostConn = null; G = null; isHost = false;
}

/* --- WORD-BY-WORD FADE TEXT --- */
let Q = [], qBusy = false, qGen = 0, seenLog = -1, lastKey = '', roleShown = false, infoRound = 0, overShown = false;

function resetStory() { qGen++; Q = []; qBusy = false; seenLog = -1; lastKey = ''; roleShown = false; infoRound = 0; overShown = false; }

function say(text, cls) { Q.push({ text, cls }); if (!qBusy) pump(qGen); }

function pump(g) {
  if (g !== qGen) return;
  const it = Q.shift();
  if (!it) { qBusy = false; return; }
  const st = $('story');
  if (!st) { Q = []; qBusy = false; return; }
  qBusy = true;
  const d = document.createElement('p');
  d.className = 'line ' + (it.cls || '');
  const ws = it.text.split(' ');
  d.innerHTML = ws.map((w, i) => `<span class="w" style="animation-delay:${i * WORD_MS}ms">${esc(w)}</span>`).join(' ');
  st.appendChild(d);
  while (st.children.length > 7) st.removeChild(st.firstChild);
  d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  setTimeout(() => pump(g), ws.length * WORD_MS + 500);
}

function home(msg) {
  cleanup(); V = null; resetStory(); closeOv(); document.body.className = '';
  app.innerHTML = `
    <h1>🕵️ MAFIA</h1>
    <p class="sub">Trust no one.</p>
    <div class="card">
      <input id="nm" placeholder="Your Name" maxlength="12">
      <button onclick="create()">Create Room</button>
    </div>
    <div class="card">
      <input id="cd" placeholder="Room Code" maxlength="5" style="text-transform:uppercase">
      <button class="gray" onclick="join()">Join Room</button>
    </div>
    ${msg ? `<div class="alert">${esc(msg)}</div>` : ''}
  `;
}

function nm() { const n = $('nm').value.trim(); if(!n) { home('Enter a name first'); return null; } return n; }

/* --- HOST LOGIC --- */
const PEER_OPTS = { debug: 1, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } };

function create(retryName) {
  if (busy && !retryName) return;
  const n = retryName || nm(); if (!n) return;
  home('Connecting to server... Please wait (up to 20s).');
  isHost = true; myName = n; busy = true; // must come AFTER home(), which resets them

  code = Math.random().toString(36).slice(2, 7).toUpperCase();
  const s = sess;
  try { peer = new Peer('mafia-mca-' + code, PEER_OPTS); }
  catch (e) { return home('PeerJS library not loaded. Check internet / INTERNET permission.'); }

  let timeout = setTimeout(() => {
    if (s === sess && !G) { home('Could not reach the PeerJS server. Check internet (or try again in a minute, the free server is sometimes busy).'); cleanup(); }
  }, 20000);

  peer.on('open', id => {
    if (s !== sess) return;
    clearTimeout(timeout);
    myId = id;
    G = { phase:'lobby', round:0, opts:{...DEFAULT_OPTS}, players:[{id, name:myName, alive:true, conn:null}], acts:{}, votes:{}, log:[], info:{}, chat:[] };
    push();
  });

  peer.on('connection', c => {
    c.on('data', d => { if (s === sess && G) hostMsg(c, d); });
    c.on('close', () => { if (s === sess && G) { const p = G.players.find(x => x.conn === c); if(p) leave(p); } });
  });

  peer.on('disconnected', () => { if (s === sess && peer && !peer.destroyed) { try { peer.reconnect(); } catch(e) {} } });

  peer.on('error', e => {
    clearTimeout(timeout);
    if (s !== sess) return;
    if (e.type === 'unavailable-id') { const nn = myName; try { peer.destroy(); } catch(x) {} create(nn); }
    else if (!G) home('Server error: ' + e.type + '. Check internet and try again.');
  });
}

function hostMsg(c, d) {
  if (d.t === 'join') {
    if (G.phase !== 'lobby') return c.send({t:'err', m:'Game already started'});
    if (G.players.length >= 15) return c.send({t:'err', m:'Room is full'});
    let n = String(d.name).slice(0, 12);
    while (G.players.some(p => p.name === n)) n += '_';
    G.players.push({ id: c.peer, name: n, alive: true, conn: c });
    push(); return;
  }
  const p = G.players.find(p => p.conn === c);
  if (!p) return;
  if (d.t === 'leave') return leave(p);
  act(p, d);
}

function leave(p) {
  if (p.gone || !G.players.includes(p)) return; p.gone = true; // avoid double-handling (leave msg + conn close)
  if (G.phase === 'lobby' || G.phase === 'over') {
    G.players = G.players.filter(x => x !== p);
    if (p.conn) try { p.conn.close(); } catch(e) {}
    return push();
  }
  p.alive = false;
  G.log.push(p.kicked ? '👢 ' + p.name + ' was kicked by the host.' : '🚪 ' + p.name + ' disconnected.');
  if (win()) return;
  if (G.phase === 'night' && nightDone()) resolveNight();
  else if (G.phase === 'day' && G.players.filter(x => x.alive).every(x => x.id in G.votes)) resolveVote();
  else push();
}

function leaveRoom() {
  if (!confirm('Leave the room?')) return;
  if (isHost) { G.players.forEach(p => { if(p.conn) try{p.conn.send({t:'end'})}catch(e){} }); setTimeout(()=>home('You ended the room.'), 200); }
  else { try{hostConn.send({t:'leave'})}catch(e){}; setTimeout(()=>home('You left.'), 200); }
}

function kick(id) {
  if (!isHost || !G) return;
  const p = G.players.find(x => x.id === id && x.conn);
  if (!p) return;
  p.kicked = true; // flag first, so the close event is also logged as a kick
  const c = p.conn;
  try { c.send({t:'kicked'}); } catch(e) {}
  setTimeout(() => { if (G && G.players.includes(p)) leave(p); try { c.close(); } catch(e) {} }, 250);
}

function send(d) { if (isHost) act(G.players[0], d); else if (hostConn) hostConn.send(d); }

/* --- GAME ACTIONS --- */
function act(p, d) {
  if (d.t === 'opt' && G.phase === 'lobby' && p === G.players[0]) {
    if (d.k === 'time') { if (TIMES.includes(+d.val)) { G.opts.time = +d.val; push(); } return; }
    if (OPTIONAL_ROLES.includes(d.k)) { G.opts[d.k] = !!d.val; push(); }
    return;
  }
  if (d.t === 'chat' && G.phase === 'day' && p.alive) {
    G.chat.push(p.name + ': ' + String(d.text).slice(0, 120));
    if (G.chat.length > 30) G.chat.shift();
    return push();
  }
  if (d.t === 'act' && G.phase === 'night' && p.alive && ACTIVE_ROLES.includes(p.role) && !(p.id in G.acts)) {
    const t = G.players.find(x => x.id === d.target && x.alive);
    if (!t) return;
    if (p.role === 'mafia' && t.role === 'mafia') return;
    if (p.role === 'detective' && t === p) return;
    G.acts[p.id] = t.id;
    if (p.role === 'detective') G.info[p.id] = t.name + ' is ' + (t.role === 'mafia' ? 'MAFIA 🔪' : 'NOT Mafia ✅');
    if (nightDone()) resolveNight(); else push();
    return;
  }
  if (d.t === 'vote' && G.phase === 'day' && p.alive && !(p.id in G.votes)) {
    let v = d.target;
    if (v !== 'skip') { const t = G.players.find(x => x.id === d.target && x.alive && x !== p); if (!t) return; }
    G.votes[p.id] = v;
    if (G.players.filter(x => x.alive).every(x => x.id in G.votes)) resolveVote(); else push();
  }
}

function start() {
  if (G.phase !== 'lobby') return;
  const n = G.players.length;
  if (n < 5) return alert('Need at least 5 players!');
  const mc = Math.max(1, Math.floor((n - 1) / 3));
  const roles = Array(mc).fill('mafia');
  OPTIONAL_ROLES.forEach(r => { if (G.opts[r] && roles.length < n) roles.push(r); });
  while (roles.length < n) roles.push('civilian');
  for (let i = roles.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [roles[i], roles[j]] = [roles[j], roles[i]]; }
  G.players.forEach((p, i) => { p.role = roles[i]; p.alive = true; });
  G.round = 0; G.winner = null; G.log = ['The game begins.']; G.chat = [];
  startNight();
}

function startNight() {
  G.phase = 'night'; G.round++; G.acts = {}; G.votes = {}; G.info = {}; G.chat = []; push();
}

const nightDone = () => G.players.filter(p => p.alive && ACTIVE_ROLES.includes(p.role)).every(p => p.id in G.acts);

function resolveNight() {
  const maf = G.players.filter(p => p.alive && p.role === 'mafia'), cnt = {};
  maf.forEach(m => cnt[G.acts[m.id]] = (cnt[G.acts[m.id]] || 0) + 1);
  const vals = Object.values(cnt);
  const top = vals.length ? Math.max(...vals) : 0;
  const tops = vals.length ? Object.keys(cnt).filter(k => cnt[k] === top) : [];
  const tid = tops.length ? tops[Math.floor(Math.random() * tops.length)] : null;
  const tg = G.players.find(p => p.id === tid);
  const doc = G.players.find(p => p.alive && p.role === 'doctor');
  const saved = doc && tid && G.acts[doc.id] === tid;

  let msg = '';
  if (tg && tg.role === 'granny') {
    const ks = maf.filter(m => G.acts[m.id] === tid); ks.forEach(k => k.alive = false);
    msg = '🌅 The sun rises. The mafia attacked Granny... and ' + ks.map(k => k.name).join(', ') + (ks.length > 1 ? ' (all Mafia) were' : ' (Mafia) was') + ' killed instead!';
  } else if (saved) {
    msg = '🌅 The sun rises. The mafia struck, but the doctor saved the victim. Nobody died.';
  } else if (tg) {
    tg.alive = false; msg = '🌅 The sun rises. ' + tg.name + ' was found dead. They were ' + ROLES[tg.role][0] + '.';
  } else { msg = '🌅 The sun rises on a quiet night.'; }

  G.log.push(msg); G.acts = {}; G.votes = {}; G.phase = 'day'; G.deadline = Date.now() + G.opts.time * 1000;
  if (!win()) push();
}

function resolveVote() {
  G.deadline = null;
  const cnt = {};
  Object.values(G.votes).forEach(target => {
    // ignore votes for players who are already dead (e.g. disconnected)
    if (target !== 'skip' && !G.players.some(p => p.id === target && p.alive)) return;
    cnt[target] = (cnt[target] || 0) + 1;
  });
  const s = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  let winner = null, msg = '';
  if (!s.length || s[0][0] === 'skip' || (s[1] && s[1][1] === s[0][1])) msg = '🗳️ No majority. Nobody was voted out.';
  else {
    const t = G.players.find(p => p.id === s[0][0]); t.alive = false;
    if (t.role === 'jester') winner = 'Jester';
    msg = '🗳️ The town has spoken. ' + t.name + ' was voted out. They were ' + ROLES[t.role][0] + '.';
  }
  G.log.push(msg);
  if (winner) { G.phase = 'over'; G.winner = winner; return push(); }
  if (!win()) startNight();
}

function win() {
  const a = G.players.filter(p => p.alive), m = a.filter(p => p.role === 'mafia').length;
  const w = m === 0 ? 'Civilians' : (m >= a.length - m ? 'Mafia' : null);
  if (w) { G.phase = 'over'; G.winner = w; G.deadline = null; push(); return true; }
  return false;
}

function again() {
  if (G.phase !== 'over') return;
  G.players.forEach(p => {
    if (!p.alive && p.conn) {
      try { p.conn.send({t:'end'}); } catch(e) {}
      try { p.conn.close(); } catch(e) {}
    }
  });
  G.players = G.players.filter(p => p.alive || !p.conn); // never drop the host
  G.players.forEach(p => { p.role = null; if (!p.conn) p.alive = true; });
  G.phase = 'lobby'; G.deadline = null; G.log = []; G.chat = []; push();
}

/* --- VIEW & RENDER --- */
function view(p) {
  return {
    phase: G.phase, code, round: G.round, host: p.id === myId, opts: {...G.opts}, left: (G.phase === 'day' && G.deadline) ? Math.max(0, G.deadline - Date.now()) : null, players: G.players.map(x => ({ id: x.id, name: x.name, alive: x.alive, role: (G.phase==='over'||!x.alive||(p.role==='mafia'&&x.role==='mafia'))?x.role:null })),
    you: { id: p.id, role: p.role, alive: p.alive }, log: G.log.slice(-5), logBase: Math.max(0, G.log.length - 5), chat: G.chat, info: G.info[p.id] || '', winner: G.winner,
    need: (G.phase==='night'&&p.alive&&ACTIVE_ROLES.includes(p.role)&&!(p.id in G.acts))?'act':(G.phase==='day'&&p.alive&&!(p.id in G.votes))?'vote':null,
    voted: G.phase === 'day' && p.id in G.votes, waiting: G.phase === 'day' ? G.players.filter(x => x.alive && !(x.id in G.votes)).length : 0
  };
}

function push() { G.players.forEach(p => { const v = view(p); if (p.conn) { try { p.conn.send({t:'v',v}); } catch(e) {} } else { V = v; render(); } }); }

/* --- CLIENT LOGIC --- */
function join() {
  if (busy) return;
  const n = nm(); if (!n) return;
  const c = $('cd').value.trim().toUpperCase(); if (!c) return home('Enter room code');
  home('Connecting to room ' + c + '...');
  busy = true; code = c; myName = n;

  const s = sess;
  try { peer = new Peer(PEER_OPTS); }
  catch (e) { return home('PeerJS library not loaded. Check internet / INTERNET permission.'); }
  let timeout = setTimeout(() => { if(s===sess) { home('Connection timed out. Check the code and your internet.'); cleanup(); } }, 20000);

  peer.on('open', id => {
    if (s !== sess) return; myId = id;
    hostConn = peer.connect('mafia-mca-' + c, { reliable: true });
    hostConn.on('open', () => { clearTimeout(timeout); hostConn.send({t:'join', name:n}); });
    hostConn.on('data', d => {
      if (s !== sess) return;
      if (d.t === 'v') { V = d.v; render(); }
      else if (d.t === 'err') home(d.m);
      else if (d.t === 'end') home('Host ended the game.');
      else if (d.t === 'kicked') home('You were kicked by the host.');
    });
    hostConn.on('close', () => { if(s===sess) home('Disconnected from host.'); });
  });

  peer.on('error', e => { clearTimeout(timeout); if(s===sess) home(e.type === 'peer-unavailable' ? 'Room not found. Check the code.' : 'Network error: ' + e.type); });
}

/* --- RENDER UI --- */
const winText = w => ({ Civilians:'The Civilians win!', Mafia:'The Mafia win!', Jester:'The Jester wins!' }[w] || (w + ' wins!'));
function setOpt(k, val) { send({t:'opt', k, val}); }
const av = n => `<span class="av">${esc(n.charAt(0).toUpperCase())}</span>`;

function btns(v, t) {
  const ok = p => p.alive && (t === 'vote' ? p.id !== v.you.id : v.you.role === 'doctor' || (p.id !== v.you.id && !(v.you.role === 'mafia' && p.role === 'mafia')));
  return '<div class="grid">' + v.players.filter(ok).map((p, i) => `<button style="animation-delay:${i * 60}ms" onclick="send({t:'${t}',target:'${p.id}'})">${av(p.name)}${esc(p.name)}</button>`).join('') + (t==='vote'?`<button class="skip" onclick="send({t:'vote',target:'skip'})">⏭️ Skip vote</button>`:'') + '</div>';
}

function render() {
  const v = V; if (!v) return;
  document.body.className = v.phase === 'night' ? 'night' : v.phase === 'day' ? 'day' : v.phase === 'over' ? 'over' : '';
  if (!$('story')) app.innerHTML = '<div id="top"></div><div id="story"></div><div id="bot"></div>';

  /* story (typed text) */
  if (v.phase === 'lobby') { if (seenLog >= 0 || lastKey || roleShown) { resetStory(); $('story').innerHTML = ''; } }
  else {
    if (!roleShown) { roleShown = true; const r = ROLES[v.you.role]; say('You are the ' + r[0] + '. ' + r[1], 'role'); }
    v.log.forEach((l, i) => { if (v.logBase + i > seenLog) { seenLog = v.logBase + i; say(l); } });
    const key = v.phase + v.round;
    if (key !== lastKey && (v.phase === 'night' || v.phase === 'day')) {
      lastKey = key;
      say(v.phase === 'night' ? '🌙 Night ' + v.round + ' falls. The town sleeps... but not everyone.' : '☀️ Day ' + v.round + '. Discuss, accuse, and vote.', 'phase');
    }
    if (v.info && infoRound !== v.round) { infoRound = v.round; say('🔍 ' + v.info, 'info'); }
    if (v.phase === 'over' && !overShown) { overShown = true; say('🏆 ' + winText(v.winner), 'phase'); }
  }

  /* top */
  const r = v.you.role ? ROLES[v.you.role] : null;
  const pill = { lobby: 'LOBBY', night: '🌙 NIGHT ' + v.round, day: '☀️ DAY ' + v.round, over: 'GAME OVER' }[v.phase];
  endAt = v.left != null ? Date.now() + v.left : 0;
  let t = `<div class="topbar"><div class="code">${v.code}</div><div><span id="tm" class="tm"></span><span class="pill">${pill}</span></div></div>`;
  if (r && v.phase !== 'lobby') t += `<div class="card role"><span class="em">${r[2]}</span><div><b>${r[0]}</b> ${v.you.alive ? '' : '💀'}<div class="muted">${r[1]}</div></div></div>`;
  $('top').innerHTML = t; updTimer();

  /* bottom */
  const old = $('ct'), keep = old ? old.value : '', focus = old && document.activeElement === old, oldChat = $('chatbox'), scr = oldChat ? oldChat.scrollTop : 0, wasBottom = !oldChat || (oldChat.scrollTop + oldChat.clientHeight >= oldChat.scrollHeight - 20);
  let h = '';
  if (v.phase === 'lobby') {
    h += `<p class="muted" style="margin:14px 0">Share code <b>${v.code}</b> with friends. (Need 5+ players)</p>`;
    h += `<div class="card"><h3>Roles</h3>
      <div class="chk"><span>🔪 <b>Mafia</b><small>Always in the game.</small></span></div>
      ${OPTIONAL_ROLES.map(k => {
        const r = ROLES[k], on = !!v.opts[k];
        return v.host
          ? `<label class="chk"><input type="checkbox" ${on?'checked':''} onchange="setOpt('${k}', this.checked)"><span>${r[2]} <b>${r[0]}</b><small>${r[1]}</small></span></label>`
          : `<div class="chk ${on?'':'off'}"><span>${r[2]} <b>${r[0]}</b>${on?`<small>${r[1]}</small>`:' — off'}</span></div>`;
      }).join('')}
    </div>`;
    h += `<div class="card"><h3>⏱ Day voting time</h3>${v.host ? `<select onchange="setOpt('time', +this.value)">${TIMES.map(t => `<option value="${t}" ${t === v.opts.time ? 'selected' : ''}>${t} seconds</option>`).join('')}</select>` : `<p>${v.opts.time} seconds</p>`}</div>`;
    h += v.host ? `<button style="margin-top:16px" onclick="start()">Start Game</button>` : '<p class="muted" style="margin-top:16px">Waiting for host...</p>';
  } else {
    if (v.phase === 'over') {
      h += `<div class="card win">🏆 ${winText(v.winner)}</div>`;
      if (v.host) h += '<button class="gray" onclick="again()">Back to Lobby</button>';
    }
    if (v.phase === 'night') {
      if (v.need === 'act') h += `<p style="margin-top:8px">${v.you.role==='mafia'?'Choose a victim':v.you.role==='doctor'?'Choose who to save':'Choose who to investigate'}:</p>` + btns(v, 'act');
      else h += '<p class="muted" style="margin-top:8px">Waiting for others... 😴</p>';
    }
    if (v.phase === 'day') {
      h += `<div class="chat" id="chatbox">${v.chat.map(c=>`<div>${esc(c)}</div>`).join('')}</div>`;
      if (v.you.alive) h += `<div class="row"><input id="ct" placeholder="Say something..."><button onclick="chat()">Send</button></div>`;
      if (v.need === 'vote') h += `<p style="margin-top:12px">Cast your vote:</p>` + btns(v, 'vote');
      else if (v.voted) h += `<p class="muted" style="margin-top:10px">Vote cast. Waiting for ${v.waiting}...</p>`;
    }
  }
  h += `<div class="players">${v.players.map(p => { const showRole = p.role && (!p.alive || v.phase === 'over' || (p.role === 'mafia' && v.you.role === 'mafia')); return `<div class="pc ${p.alive?'':'dead'}" ${v.host && p.id !== v.you.id && p.alive ? 'data-id="' + esc(p.id) + '"' : ''}>${av(p.name)}<div><span class="nm">${esc(p.name)}</span>${showRole ? `<small>${ROLES[p.role][2]} ${ROLES[p.role][0]}</small>` : ''}</div></div>`; }).join('')}</div>`;
  if (v.host && v.players.length > 1) h += '<p class="muted" style="margin-top:10px;text-align:center">Host: hold a player to kick them.</p>';
  h += `<button class="gray" style="margin-top:20px" onclick="leaveRoom()">${v.host?'End Game':'Leave Room'}</button>`;
  $('bot').innerHTML = h;

  const cbox = $('chatbox'); if (cbox) cbox.scrollTop = wasBottom ? cbox.scrollHeight : scr;
  const n = $('ct'); if (n) { n.value = keep; if (focus) n.focus(); }
}

function chat() { const e = $('ct'); if (e && e.value.trim()) { send({t:'chat', text:e.value}); e.value = ''; } }

function updTimer() {
  const e = $('tm'); if (!e) return;
  if (!V || V.phase !== 'day' || !endAt) { e.textContent = ''; return; }
  const s = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  e.textContent = '⏱ ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  e.className = 'tm' + (s <= 10 ? ' low' : '');
}
setInterval(() => {
  updTimer();
  // host ends the vote when time runs out (players who didn't vote count as abstaining)
  if (isHost && G && G.phase === 'day' && G.deadline && Date.now() >= G.deadline) resolveVote();
}, 500);

function closeOv() { const o = $('ov'); if (o) o.remove(); }
function kickMenu(id) {
  const p = V && V.players.find(x => x.id === id);
  if (!p || !isHost) return;
  closeOv();
  const o = document.createElement('div'); o.id = 'ov';
  o.innerHTML = `<div class="card"><h3>${esc(p.name)}</h3><button id="kk">👢 Kick player</button><button class="gray" id="kc">Cancel</button></div>`;
  o.onclick = e => { if (e.target === o) closeOv(); };
  o.querySelector('#kk').onclick = () => { kick(id); closeOv(); };
  o.querySelector('#kc').onclick = closeOv;
  document.body.appendChild(o);
}
function lpStart(e) {
  const el = e.target.closest && e.target.closest('.pc[data-id]');
  if (!el || !isHost || !V) return;
  clearTimeout(lpT);
  const id = el.dataset.id;
  lpT = setTimeout(() => kickMenu(id), 600);
}
function lpEnd() { clearTimeout(lpT); }
['touchstart', 'mousedown'].forEach(ev => app.addEventListener(ev, lpStart, { passive: true }));
['touchend', 'touchmove', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => app.addEventListener(ev, lpEnd, { passive: true }));
app.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.pc[data-id]')) e.preventDefault(); });

home();
</script>
</body>
</html>
