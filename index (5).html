<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mafia Multiplayer</title>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="./icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  /* ===== MAFIA design system: charcoal, ivory, muted bronze. Role colours are a local accent layer (body[data-role]). ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg1:#111111; --bg2:#191919; --card:#202020; --line:#39332D; --txt:#EAE5DA; --mut:#A6A198;
    --bronze:#A98C62; --gold:#B49A68; --burgundy:#762B32; --burgundy-hi:#8A3640;
    --c-civilian:#54D477; --c-special:#F2C451; --c-mafia:#E05252; --c-shapeshifter:#E34B86; --c-doctor:#42CDE0; --c-detective:#64748B;
    --role-accent:#B49A68; --role-soft:rgba(180,154,104,.12);
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --serif: Georgia, 'Times New Roman', serif;
  }
  body[data-role="civilian"]     { --role-accent:#54D477; --role-soft:rgba(84,212,119,.12); }
  body[data-role="special"]      { --role-accent:#F2C451; --role-soft:rgba(242,196,81,.12); }
  body[data-role="mafia"]        { --role-accent:#E05252; --role-soft:rgba(224,82,82,.12); }
  body[data-role="shapeshifter"] { --role-accent:#E34B86; --role-soft:rgba(227,75,134,.12); }
  body[data-role="doctor"]       { --role-accent:#42CDE0; --role-soft:rgba(66,205,224,.12); }
  body[data-role="detective"]    { --role-accent:#64748B; --role-soft:rgba(100,116,139,.16); }
  html, body { min-height: 100%; }
  body { font-family: var(--sans); background: linear-gradient(180deg, var(--bg2), var(--bg1) 60%) fixed; color: var(--txt); padding: 16px; display: flex; justify-content: center; }
  body.night { --bg2:#0e0e0e; --bg1:#0a0a0a; }
  button, input, select { font-family: inherit; }
  .app { width: 100%; max-width: 480px; padding-bottom: 30px; }
  h1 { font-family: var(--serif); font-size: 28px; font-weight: normal; text-align: center; letter-spacing: 6px; margin: 28px 0 4px; color: var(--gold); }
  .sub { text-align: center; color: var(--mut); font-family: var(--serif); font-style: italic; margin-bottom: 18px; }
  h2, h3 { font-family: var(--serif); font-weight: normal; margin-bottom: 10px; letter-spacing: .5px; color: var(--txt); }
  h3 { font-size: 17px; }
  input { width: 100%; padding: 13px 14px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: #151515; color: var(--txt); font-size: 16px; outline: none; }
  input:focus, select:focus { border-color: var(--bronze); }
  button { width: 100%; padding: 13px; margin: 6px 0; border: 1px solid transparent; border-radius: 8px; background: var(--burgundy); color: var(--txt); font-size: 15px; font-weight: 600; letter-spacing: .3px; cursor: pointer; transition: transform .1s, background .2s, border-color .2s; }
  button:hover { background: var(--burgundy-hi); }
  button:active { transform: scale(.98); }
  button.gray { background: transparent; border-color: var(--line); color: var(--txt); }
  button.gray:hover { background: var(--card); border-color: var(--bronze); }
  button.act { background: var(--role-soft); border-color: var(--role-accent); color: var(--txt); }
  button.act:hover { background: var(--role-soft); filter: brightness(1.25); }
  .card { background: var(--card); border-radius: 10px; padding: 16px; margin: 12px 0; border: 1px solid var(--line); animation: rise .5s both; }
  .muted { color: var(--mut); font-size: 14px; }
  .alert { background: rgba(118,43,50,.25); border: 1px solid var(--burgundy); color: #E8C9C9; padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .code { font-family: var(--serif); font-size: 22px; letter-spacing: 5px; color: var(--gold); }
  .pill { background: transparent; color: var(--txt); border: 1px solid var(--line); border-left: 3px solid var(--role-accent); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
  .role { display: flex; gap: 14px; align-items: center; border-left: 3px solid var(--role-accent); background: linear-gradient(90deg, var(--role-soft), var(--card) 70%); animation: reveal .9s both; }
  .role .em { font-size: 34px; }
  .role b { font-family: var(--serif); font-weight: normal; font-size: 20px; color: var(--role-accent); letter-spacing: .5px; }
  .role[data-rt="civilian"] { --role-accent:#54D477; --role-soft:rgba(84,212,119,.12); }
  .role[data-rt="special"] { --role-accent:#F2C451; --role-soft:rgba(242,196,81,.12); }
  .role[data-rt="mafia"] { --role-accent:#E05252; --role-soft:rgba(224,82,82,.12); }
  .role[data-rt="shapeshifter"] { --role-accent:#E34B86; --role-soft:rgba(227,75,134,.12); }
  .role[data-rt="doctor"] { --role-accent:#42CDE0; --role-soft:rgba(66,205,224,.12); }
  .role[data-rt="detective"] { --role-accent:#64748B; --role-soft:rgba(100,116,139,.16); }
  @keyframes reveal { from { opacity: 0; transform: translateY(8px) scale(.98); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  #story { margin: 14px 0; min-height: 10px; }
  .line { margin: 10px 0; font-size: 16px; line-height: 1.6; color: var(--txt); }
  .line.phase { font-family: var(--serif); font-size: 18px; font-style: italic; padding-left: 10px; border-left: 3px solid var(--role-accent); }
  .line.role, .line.info { color: var(--role-accent); }
  .line.role { display: block; }
  .w { opacity: 0; display: inline-block; animation: fadeWord .6s forwards; }
  @keyframes fadeWord { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .chat { background: #151515; border-radius: 8px; padding: 10px; min-height: 90px; max-height: 190px; overflow-y: auto; margin-bottom: 8px; font-size: 14px; }
  .chat div { margin-bottom: 4px; animation: rise .3s both; }
  .row { display: flex; gap: 8px; }
  .row button { width: auto; padding: 0 20px; margin: 0; }
  .row input { margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .grid button { display: flex; align-items: center; gap: 8px; text-align: left; background: var(--card); border: 1px solid var(--line); color: var(--txt); font-weight: 500; margin: 0; animation: rise .4s both; }
  .grid button:hover, .grid button:active { border-color: var(--role-accent); background: var(--role-soft); }
  .grid button.sel { border-color: var(--role-accent); background: var(--role-soft); box-shadow: inset 3px 0 0 var(--role-accent); }
  .grid button.skip { grid-column: 1 / -1; justify-content: center; color: var(--mut); }
  .av { width: 30px; height: 30px; border-radius: 50%; background: #2B2722; border: 1px solid var(--bronze); color: var(--gold); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex: none; }
  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .pc { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; animation: rise .4s both; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .pc small { display: block; color: var(--mut); font-size: 11px; }
  .pc small.rl[data-rt="civilian"] { color: var(--c-civilian); } .pc small.rl[data-rt="special"] { color: var(--c-special); }
  .pc small.rl[data-rt="mafia"] { color: var(--c-mafia); } .pc small.rl[data-rt="shapeshifter"] { color: var(--c-shapeshifter); }
  .pc small.rl[data-rt="doctor"] { color: var(--c-doctor); } .pc small.rl[data-rt="detective"] { color: var(--c-detective); filter: brightness(1.35); }
  .pc.dead { opacity: .45; } .pc.dead .nm { text-decoration: line-through; } .pc.dead .av { border-color: #444; color: #777; }
  .win { text-align: center; font-family: var(--serif); font-size: 21px; color: var(--gold); border-color: var(--bronze); }
  .chk { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-size: 15px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .chk:last-child { border-bottom: 0; }
  .chk input { width: 18px; height: 18px; margin: 2px 0 0; padding: 0; flex: none; accent-color: var(--bronze); border: 0; background: none; border-radius: 0; }
  .chk small { display: block; color: var(--mut); font-size: 12px; }
  .chk.off { opacity: .4; }
  select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: #151515; color: var(--txt); font-size: 16px; outline: none; }
  .section-h { font-size: 12px; color: var(--bronze); text-transform: uppercase; letter-spacing: 1.5px; margin: 14px 0 4px; }
  .prompt-card { background: var(--role-soft); border: 1px solid var(--role-accent); padding: 16px; border-radius: 10px; margin: 12px 0; }
  .prompt-card.rebel { background: var(--role-soft); border-color: var(--role-accent); }
  .prompt-card h3 { color: var(--role-accent); margin-bottom: 8px; }
  .tm { font-weight: 600; margin-right: 8px; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--gold); }
  .tm.low { color: #E05252; animation: pulse .8s infinite alternate; }
  @keyframes pulse { to { opacity: .45; } }
  #ov { position: fixed; inset: 0; background: rgba(0,0,0,.78); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  #ov .card { max-width: 340px; width: 100%; background: var(--card); }
  .chat-card { padding: 12px 16px; }
  .chat-toggle { display: flex; justify-content: space-between; align-items: center; background: transparent; border: 0; color: var(--txt); padding: 4px 0; margin: 0; font-weight: 600; text-align: left; width: 100%; }
  .chat-toggle:hover { background: transparent; }
  .chat-toggle .chev { font-size: 11px; opacity: .6; transition: transform .15s; display: inline-block; }
  .chat-toggle.collapsed .chev { transform: rotate(-90deg); }
  .chat-badge { background: var(--gold); color: #111; border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 700; margin-left: 6px; }
  .chat-body { margin-top: 8px; }
  .chat-messages-wrap { position: relative; }
  .chat-messages { background: #151515; border-radius: 8px; padding: 10px; min-height: 90px; max-height: 190px; overflow-y: auto; font-size: 14px; margin-bottom: 8px; }
  .chat-messages div { margin-bottom: 4px; }
  .chat-new-btn { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: auto; padding: 6px 14px; margin: 0; background: var(--gold); color: #111; font-size: 12px; font-weight: 700; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .chat-new-btn:hover { background: var(--gold); }
  .game-credits { text-align: center; margin: 22px 0 8px; padding: 10px 8px; color: var(--mut); font-size: 11px; letter-spacing: .45px; line-height: 1.6; }
  .game-credits small { display: block; margin-top: 3px; font-size: 9px; opacity: .7; }
  .credit-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .credit-row:last-child { border-bottom: 0; }
  .credit-row span:first-child { color: var(--mut); }
  .credit-row span:last-child { text-align: right; }
  .vdot { width: 11px; height: 11px; border-radius: 50%; margin-left: auto; flex: none; }
  .vdot.yes { background: #54D477; }
  .vdot.no { background: #E05252; }
  .ghost-card { border-style: dashed; }
  .maf-card { border-color: var(--c-mafia); }
  .ghost-card .chat-messages div { color: var(--mut); }
  .hidden { display: none !important; }
  .home-head { position:relative; }
  .profile-trigger { position:absolute; right:0; top:18px; width:44px; height:44px; padding:0; margin:0; border-radius:50%; background:#242321; border:3px solid var(--frame-color,#A98C62); color:var(--txt); display:flex; align-items:center; justify-content:center; font-size:18px; }
  .profile-trigger:hover { border-color:var(--gold); background:#302b25; }
  .profile-modal { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.82); display:flex; align-items:center; justify-content:center; padding:14px; }
  .profile-panel { width:100%; max-width:460px; max-height:90vh; overflow:auto; background:#1d1c1b; border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 18px 70px #000b; }
  .profile-head { display:flex; align-items:center; gap:13px; margin-bottom:14px; }
  .profile-avatar { width:58px; height:58px; border-radius:50%; border:4px solid var(--frame-color,#A98C62); display:flex; align-items:center; justify-content:center; font-size:24px; background:#282522; flex:none; }
  .frame-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin:10px 0; }
  .frame-choice { border:1px solid var(--line); border-radius:9px; padding:9px 4px; background:#171717; text-align:center; font-size:11px; cursor:pointer; }
  .frame-choice .ring { width:34px; height:34px; margin:0 auto 5px; border-radius:50%; border:4px solid var(--fc); background:#292725; }
  .frame-choice.locked { opacity:.35; cursor:not-allowed; }
  .achievement-row { border:1px solid var(--line); border-radius:9px; padding:11px; margin:8px 0; background:#181818; cursor:pointer; }
  .achievement-row.unlocked { border-color:#806c48; }
  .achievement-row .ach-title { font-weight:650; }
  .achievement-row .ach-desc { color:var(--mut); font-size:12px; line-height:1.45; margin-top:8px; }
  .achievement-row .ach-meta { color:var(--mut); font-size:11px; margin-top:4px; }
  .ach-toast { position:fixed; z-index:100; left:12px; top:42%; width:min(290px,calc(100vw - 24px)); background:rgba(24,23,22,.97); border:1px solid #9c804e; border-left:4px solid #c5a66a; border-radius:9px; padding:11px 13px; box-shadow:0 8px 30px #0009; animation:achIn .28s ease-out; pointer-events:none; }
  .ach-toast .eyebrow { color:#c9aa70; font-size:10px; font-weight:800; letter-spacing:1.3px; margin-bottom:4px; }
  .ach-toast .name { color:#f0e5d2; font-family:var(--serif); font-size:15px; }
  @keyframes achIn { from { opacity:0; transform:translateX(-18px); } to { opacity:1; transform:none; } }
  .reveal-screen { position:fixed; inset:0; z-index:95; background:radial-gradient(ellipse at center,#391b20 0%,#100d10 58%,#050505 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:25px; animation:reveal .8s both; }
  .reveal-screen .stamp { color:#e3c48d; letter-spacing:5px; font-size:12px; }
  .reveal-screen h2 { color:#f1d6a5; font-size:clamp(30px,8vw,48px); line-height:1.08; margin:18px 0; text-shadow:0 4px 30px #b13a48aa; }
  .reveal-screen .truth { color:#e45b65; font-family:var(--serif); font-size:clamp(20px,5vw,29px); letter-spacing:2px; }
  .reveal-screen p { color:#d2c5b5; line-height:1.6; max-width:340px; margin:12px auto 24px; }
  .reveal-screen button { max-width:230px; }
.rc-line{display:flex;gap:8px;margin:5px 0;font-size:14px;line-height:1.35}.rc-line.good{color:#8fd99a}.rc-line.bad{color:#f0948f}.rc-tip{margin:8px 0;font-size:14px;line-height:1.45}.rc-tip.good{color:#8fd99a}.spec-banner{border-style:dashed}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const $ = id => document.getElementById(id);
const app = $('app');
/* ============================================================
   SOUND ENGINE: Web Audio synthesizer, no files needed
   ============================================================ */
const SFX = (() => {
  let ctx = null, enabled = true;
  function unlock() {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { enabled = false; }
  }
  function tone(freq, dur, type = 'sine', vol = 0.1, slideTo = null) {
    if (!enabled || !ctx) return;
    try {
      const t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const chord = (fs, dur, type, vol) => fs.forEach(f => tone(f, dur, type, vol));
  return {
    unlock,
    setEnabled(v) { enabled = v; },
    isEnabled: () => enabled,
    click()  { tone(880, 0.04, 'square', 0.05); },
    ping()   { chord([880, 1320], 0.14, 'sine', 0.07); },
    night()  { chord([110, 165], 0.55, 'sine', 0.10); },
    day()    { chord([440, 660], 0.30, 'triangle', 0.08); },
    kill()   { tone(200, 0.45, 'sawtooth', 0.12, 60); },
    save()   { chord([523, 659, 784], 0.30, 'sine', 0.09); },
    yourTurn(){ chord([988, 1319], 0.18, 'sine', 0.09); },
    win()    { chord([523, 659, 784, 1047], 0.6, 'sine', 0.10); },
    lose()   { chord([220, 174, 146], 0.55, 'sawtooth', 0.10); }
  };
})();
try { if (localStorage.getItem('mafia-muted') === '1') SFX.setEnabled(false); } catch(e) {}
['click', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, SFX.unlock, { once: true, passive: true }));

const ROLES = {
  mafia: ['Mafia', 'Kill one player each night.', '🔪'],
  granny: ['Granny', 'If mafia picks you, the mafia dies instead.', '👵'],
  doctor: ['Doctor', 'Save one player each night.', '💉'],
  detective: ['Detective', 'Investigate one player each night.', '🕵️'],
  civilian: ['Civilian', 'Find the mafia and vote them out.', '🧑‍🌾']
};
ROLES.jester = ['Jester', 'Get voted out during the day to win the game.', '🤡'];
ROLES.shapeshifter = ['Shapeshifter', 'A secret Mafia. Once per game, if voted out, swap names with another Mafia who dies in your place. Needs 7+ players.', '👤'];
ROLES.guard = ['Guard', 'Each night, protect one player from the Mafia. Cannot protect yourself.', '🛡️'];
ROLES.judge = ['Judge', 'Once per game: when exactly two players tie for execution, you may call a retrial.', '⚖️'];
ROLES.mayor = ['Mayor', 'Your vote counts double. Your identity stays secret.', '🏛️'];
ROLES.rebel = ['Rebel', 'Once per game: refuse your own execution. You lose your next day vote.', '✊'];
ROLES.oracle = ['Oracle', 'Once per game at night: learn whether two players are in the same faction.', '🔮'];
const ACTIVE_ROLES = ['mafia', 'shapeshifter', 'doctor', 'guard', 'detective', 'oracle'];
const OPTIONAL_ROLES = ['doctor', 'detective', 'granny', 'jester', 'shapeshifter', 'guard', 'judge', 'mayor', 'rebel', 'oracle'];
const DEFAULT_OPTS = { doctor: true, detective: true, granny: true, jester: false, shapeshifter: false, guard: false, judge: false, mayor: false, rebel: false, oracle: false, time: 90 };
const needsAct = p => p.alive && ACTIVE_ROLES.includes(p.role) && !(p.role === 'oracle' && p.oracleUsed);
const HOW_TO_PLAY = [
  { h: 'What is Mafia?', p: 'Mafia is a game about lying and guessing. Some players are bad guys (the Mafia). Most are good guys (the Civilians). Nobody knows who anyone is… except the Mafia know each other.' },
  { h: '🌙 Night', p: 'The Mafia pick one person to kill. The Doctor picks one person to save. The Detective picks one person to check. Then morning comes and everyone finds out what happened.' },
  { h: '☀️ Day', p: 'The day has four stages: open discussion, nominations, candidate defence, and a final vote. The candidate with the highest final vote total is executed; a tie or a winning Skip means nobody is executed.' },
  { h: '🔪 Mafia', p: 'Kill one player each night. You and the other Mafia know each other.' },
  { h: '💉 Doctor', p: 'Save one person each night. If you save the same person the Mafia kills, nobody dies. You can save yourself.' },
  { h: '🕵️ Detective', p: 'Each night, check one player. You find out if they are Mafia or not. You cannot check yourself.' },
  { h: '🧑‍🌾 Civilian', p: 'No special power. Just talk, listen, and vote. Watch for lies!' },
  { h: '🤡 Jester (optional)', p: 'You win alone if the town votes you out. Act suspicious, but not too suspicious!' },
  { h: '🏆 How to Win', p: '🔪 Mafia win when no good guys are left, or when Mafia are as many as the good guys. 🧑‍🌾 Good guys win when all the Mafia are dead.' },
];
const WHATS_NEW = [
  { h: '🧪 Test mode', p: 'Host a room alone and add bots from the lobby, or tap Quick start. Bots vote, act and chat. Pick your own role, use God view, Auto-play, bot speed and pause, add spectator bots, skip timers and become a ghost. Test games do not count towards stats.' },
  { h: '💬 Spectator chat', p: 'Spectators have their own chat. Only other spectators can read it, never the players.' },
  { h: '👁 Spectator mode', p: 'Join a room whose match has already started and you watch as a spectator: public chat and the log only, no roles, no actions. Spectators join the next lobby when the host taps Play Again.' },
  { h: '👻 Ghost grudge', p: 'Eliminated town players can each name one living player (Mafia ghosts cannot). Before the night starts, the narrator announces who the ghosts hold a grudge on. That player is marked with 👻 for one round, and the Detective secretly hears how many ghosts agree. Ghosts can also read the Mafia chat.' },
  { h: '🎬 Match story', p: 'After the match you get a round-by-round story of the nights and votes, plus what went well and what could have gone better, like a town player who should not have been voted out.' },

const BOT_TALK = [n => `I think ${n} is acting suspicious.`, n => `Not sure about ${n}...`, n => `Why was ${n} so quiet?`, n => `I trust ${n}.`, n => `Let's vote ${n}.`];
function runBots() {
  if (G.botsPaused || G.phase === 'lobby' || G.phase === 'over') return;
  const P = {slow: 0.08, normal: 0.3, fast: 0.9}[G.botSpeed || 'normal'];   // chance per 0.5s that an idle bot acts
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const heat = id => Object.values(G.nominations || {}).filter(t => t === id).length;
  (G.spectators || []).filter(sp => sp.bot).forEach(sp => {
    if (Math.random() < P * 0.15) { G.spec = G.spec || []; G.spec.push(sp.name + ': ' + pick(['That was close!','The Mafia are hiding well.','Who do you trust?','This round is intense.','I called that one.'])); if (G.spec.length > 50) G.spec.shift(); push(); }
  });
  const actors = G.players.filter(b => (b.bot || (G.autoHost && b === G.players[0])) && !b.gone);
  for (const b of actors) {
    if (!G || G.phase === 'lobby' || G.phase === 'over') return;
    if (Math.random() > P) continue;   // each bot acts a little while after the phase starts
    const others = G.players.filter(x => x.alive && x !== b);
    const foes = isM(b.role) ? (others.filter(x => !isM(x.role)).length ? others.filter(x => !isM(x.role)) : others) : others;   // Mafia bots never turn on their own team
    const dayish = ['discussion','nomination','defense','day','retrial'].includes(G.phase);
    if (!b.alive) {   // dead bots behave like ghosts
      if (dayish && others.length) {
        if (!isM(b.role) && !(G.ghostVotes || {})[b.id] && Math.random() < 0.5) act(b, {t:'ghostVote', target: pick(others).id});
        else if (Math.random() < 0.15) act(b, {t:'ghost', text: pick(BOT_TALK)(publicName(pick(others)))});
      }
      continue;
    }
    if (!others.length) continue;
    if (G.phase === 'night') {
      if (isM(b.role) && Math.random() < 0.2) act(b, {t:'maf', text: pick(BOT_TALK)(publicName(pick(others)))});
      if (!G || G.phase !== 'night' || !needsAct(b) || (b.id in G.acts)) continue;
      if (b.role === 'oracle') {
        if (others.length >= 2 && Math.random() < 0.5) { const a = pick(others); act(b, {t:'oracle', a: a.id, b: pick(others.filter(x => x !== a)).id}); }
        else act(b, {t:'oraclePass'});
        continue;
      }
      let pool = others;
      if (isM(b.role)) pool = others.filter(x => !isM(x.role));
      if (b.role === 'doctor') pool = G.players.filter(x => x.alive);
      if (pool.length) act(b, {t:'act', target: pick(pool).id});
    } else if (G.phase === 'discussion' || G.phase === 'defense') {
      if (Math.random() < 0.35) act(b, {t:'chat', text: pick(BOT_TALK)(publicName(pick(others)))});
    } else if (G.phase === 'nomination') {
      if (!(b.id in G.nominations)) {
        const hot = foes.filter(x => heat(x.id) > 0).sort((x, y) => heat(y.id) - heat(x.id))[0];   // town bots like to pile onto the most-nominated player
        act(b, {t:'nominate', target: Math.random() < 0.3 ? 'skip' : (hot && Math.random() < 0.5 ? hot.id : pick(foes).id)});
      }
    } else if (G.phase === 'day') {
      if (!(b.id in G.votes) && !isSilenced(b.id)) {
        let pool = G.candidates && G.candidates.length ? G.candidates.filter(id => id !== b.id) : others.map(x => x.id);
        if (isM(b.role)) { const safe = pool.filter(id => { const q = G.players.find(x => x.id === id); return q && !isM(q.role); }); pool = safe; }   // Mafia bots skip rather than vote a teammate
        const top = pool.slice().sort((x, y) => heat(y) - heat(x))[0];
        act(b, {t:'vote', target: (!pool.length || Math.random() < 0.2) ? 'skip' : (Math.random() < 0.5 ? top : pick(pool))});
      }
    } else if (G.phase === 'retrial') {
      if (!(b.id in G.votes) && !isSilenced(b.id)) {
        let pool = (G.tieIds || []).filter(id => id !== b.id);
        if (isM(b.role)) { const safe = pool.filter(id => { const q = G.players.find(x => x.id === id); return q && !isM(q.role); }); if (safe.length) pool = safe; }
        if (pool.length) act(b, {t:'vote', target: pick(pool)});
      }
    } else if (G.phase === 'judge' && b.id === G.judgeId) act(b, {t:'judge', call: Math.random() < 0.5});
    else if (G.phase === 'rebel' && b.id === G.rebelId) act(b, {t:'rebel', refuse: Math.random() < 0.5});
    else if (G.phase === 'shapeshift' && b.id === G.ssId) {
      const t = pick(G.players.filter(x => x.alive && isM(x.role) && x.id !== b.id));

    }
  }
}

/* --- GHOST GRUDGE --- */
function ghostTally() {
  const cnt = {};
  Object.entries(G.ghostVotes || {}).forEach(([gid, tid]) => {
    const gp = G.players.find(x => x.id === gid), tp = G.players.find(x => x.id === tid);
    if (gp && !gp.alive && !gp.gone && !isM(gp.role) && tp && tp.alive) cnt[tid] = (cnt[tid] || 0) + 1;
  });
  return cnt;
}
function announceGrudge() {   // called as the day ends, just before the night starts
  const cnt = ghostTally(), vals = Object.values(cnt);
  G.ghostVotes = {}; G.markedId = null; G.whisper = null;   // last round's mark and whisper expire
  if (!vals.length) return;
  const top = Math.max(...vals), tops = Object.keys(cnt).filter(k => cnt[k] === top);
  const pick = G.players.find(x => x.id === tops[Math.floor(Math.random() * tops.length)]);   // a tie is broken at random
  if (!pick) return;
  G.log.push('👻 The ghosts have a grudge on ' + publicName(pick) + '. They are marked for the next round.');
  G.markedId = pick.id;   // Marked: a 👻 next to their name for everyone, for one round
  const total = vals.reduce((a, b) => a + b, 0), det = G.players.find(x => x.alive && x.role === 'detective');
  if (det && det.id !== pick.id) G.whisper = { to: det.id, text: `${top} of ${total} ghost${total > 1 ? 's' : ''} suspect ${publicName(pick)}. Ghosts see a lot, but they can be wrong.` };   // Whisper: only the Detective hears it
  tl({k:'grudge', round:G.round, name:publicName(pick), votes:top});
}

/* --- MATCH TIMELINE & RECAP --- */
function tl(e) { G.timeline = G.timeline || []; G.timeline.push(e); }
function voteSnap(stage) {
  return {k:'vote', round:G.round, stage, votes: G.players.filter(p => p.alive).map(p => {
    const tv = G.votes[p.id], tp = tv && tv !== 'skip' ? G.players.find(x => x.id === tv) : null;
    return {voter: publicName(p), voterRole: p.role, target: tv === 'skip' ? 'Skip' : tp ? publicName(tp) : 'No vote', targetRole: tp ? tp.role : null};
  })};
}
const roleName = r => ROLES[r] ? ROLES[r][0] : 'Unknown';
const isTownRole = r => !isM(r) && r !== 'jester';
function buildRecap(w) {
  const T = G.timeline || [], by = {}, rounds = [], good = [], tips = [];
  T.forEach(e => { (by[e.round] = by[e.round] || []).push(e); });
  const execs = T.filter(e => e.k === 'exec'), invs = T.filter(e => e.k === 'inv' && e.mafia);
  Object.keys(by).map(Number).sort((a, b) => a - b).forEach(r => {
    const ev = by[r], lines = [];
    ev.forEach(e => {
      if (e.k === 'night') {
        if (e.out === 'killed') lines.push({i:'🌙', t:`${e.victim} (${roleName(e.role)}) was killed by the Mafia.`});
        else if (e.out === 'saved') lines.push({i:'💉', t:`The Mafia attacked ${e.victim}, but ${e.by || 'a protector'} saved them.`});
        else if (e.out === 'granny') lines.push({i:'👵', t:`The Mafia attacked Granny (${e.victim}) and ${e.killers.join(', ')} died instead.`});
        else lines.push({i:'🌙', t:'A quiet night. Nobody died.'});
      } else if (e.k === 'inv') lines.push({i:'🔍', t:`${e.who} (Detective) investigated ${e.target}: ${e.mafia ? 'Mafia' : 'not Mafia'}.`});
      else if (e.k === 'grudge') lines.push({i:'👻', t:`The ghosts held a grudge on ${e.name}.`});
      else if (e.k === 'vote') {
        const g = {}; e.votes.forEach(v => { (g[v.target] = g[v.target] || []).push(v.voter); });
        const parts = Object.entries(g).sort((a, b) => b[1].length - a[1].length).map(([t, vs]) => `${t} (${vs.length}): ${vs.join(', ')}`);
        lines.push({i:'🗳️', t:`${e.stage}: ${parts.join(' · ')}`});
      } else if (e.k === 'exec') lines.push({i:'⚖️', t:`${e.name} was voted out. They were ${roleName(e.role)}.`, tone: isM(e.role) ? 'good' : 'bad'});
    });
    if (ev.some(e => e.k === 'vote') && !ev.some(e => e.k === 'exec')) lines.push({i:'⏭️', t:'Nobody was voted out (skip, tie, or a cancelled execution).'});
    rounds.push({round: r, lines});
  });
  execs.forEach(e => {
    if (isM(e.role)) good.push(`Day ${e.round}: voting out ${e.name} (${roleName(e.role)}) removed a real Mafia.`);
    else if (e.role === 'jester') tips.push(`Day ${e.round}: ${e.name} was the Jester, and voting them out handed them the win. Be wary of players who seem to be fishing for the town's attention.`);
    else {
      const mv = e.voters.filter(v => isM(v.role)).map(v => v.name), tv = e.voters.filter(v => isTownRole(v.role)).map(v => v.name);
      let t = `Day ${e.round}: ${e.name} (${roleName(e.role)}) shouldn't have been voted out. They were on the town's side.`;
      if (mv.length) t += ` ${mv.join(', ')} (Mafia) helped push that vote.`;
      if (tv.length) t += ` ${tv.join(', ')} voted for them. Ask for a reason before piling on next time.`;
      const found = invs.find(i => i.round <= e.round && !execs.some(x => x.name === i.target));
      if (found) t += ` The Detective had already found ${found.target} to be Mafia.`;
      tips.push(t);
    }
  });
  T.filter(e => e.k === 'night').forEach(e => {
    if (e.out === 'killed' && ['doctor','detective','guard','oracle','judge','mayor'].includes(e.role)) tips.push(`Night ${e.round}: the Mafia took out the ${roleName(e.role)} (${e.victim}). Special roles are prime targets, so protect them or keep them hidden.`);
    if (e.out === 'saved') good.push(`Night ${e.round}: ${e.by || 'A protector'} guessed right and saved ${e.victim}.`);
    if (e.out === 'granny') tips.push(`Night ${e.round}: the Mafia attacked Granny and lost ${e.killers.join(', ')}. Be careful with targets who look too easy.`);
  });
  invs.forEach(i => { if (!execs.some(x => x.name === i.target)) tips.push(`Night ${i.round}: the Detective found ${i.target} to be Mafia, but the town never voted them out. Find a way to share results the town can trust.`); });
  const noExec = rounds.filter(r => r.lines.some(l => l.i === '⏭️')).length;
  if (noExec && w === 'Mafia') tips.push(`${noExec} day vote${noExec > 1 ? 's' : ''} ended with no execution. While Mafia are alive, a skip or tie gives them another night. Try to unite behind one suspect.`);
  T.filter(e => e.k === 'grudge').forEach(g => {
    const gp = G.players.find(x => publicName(x) === g.name);
    if (gp && isM(gp.role)) good.push(`The ghosts' grudge on ${g.name} (Mafia) was right on target. Listen to the dead.`);
  });
  const townOut = execs.filter(e => isTownRole(e.role)).length, mafOut = execs.filter(e => isM(e.role)).length;
  const uniq = a => a.filter((x, i) => a.indexOf(x) === i);
  G.recap = {
    headline: `${w === 'Jester' ? 'The Jester' : w} won after ${rounds.length} round${rounds.length === 1 ? '' : 's'}. ${mafOut} Mafia and ${townOut} town player${townOut === 1 ? ' was' : 's were'} voted out.`,
    rounds, good: uniq(good).slice(0, 6),
    tips: uniq(tips).slice(0, 8).length ? uniq(tips).slice(0, 8) : ['Nothing stood out as a clear mistake. Well played!']
  };
}

function onDisconnect(p) {
  if (p.gone || !G.players.includes(p) || !p.conn) return;
  p.conn = null;
  p.dcAt = Date.now();
  if (p.alive && !p.kicked) G.log.push('⏳ ' + publicName(p) + ' disconnected, waiting up to 2 min for reconnect...');
  autoResolve(p);
  if (G.phase === 'night' && nightDone()) return resolveNight();
  if (G.phase === 'nomination' && !waitingNominators().length) return resolveNominations();
  if (G.phase === 'day' && !waitingVoters().length) return resolveVote();
  if (G.phase === 'retrial' && !waitingVoters().length) return resolveRetrial();
  push();
}
function isSilenced(id) { return !!(G.silenced && G.silenced[id] === G.round); }
function waitingVoters() { return G.players.filter(x => x.alive && !(x.id in G.votes) && !isSilenced(x.id)); }
function autoResolve(p) {   // a disconnect must not stall night/vote
  G.auto = G.auto || {};

  if (G.phase === 'nomination' && p.alive && !(p.id in G.nominations)) { G.nominations[p.id] = 'skip'; G.auto[p.id] = 1; }
  if ((G.phase === 'day' || G.phase === 'retrial') && p.alive && !(p.id in G.votes) && !isSilenced(p.id)) { G.votes[p.id] = 'skip'; G.auto[p.id] = 1; }
}

function leave(p, reason) {
  if (p.gone || !G.players.includes(p)) return; p.gone = true; // avoid double-handling (leave msg + conn close)
  if (G.phase === 'lobby' || G.phase === 'over') {

    if (p.conn) try { p.conn.close(); } catch(e) {}

  }
  if (G.phase === 'shapeshift' && p.id === G.ssId) return shiftTimeout();
  const wasAlive = p.alive;
  p.alive = false;
  if (wasAlive) G.log.push(p.kicked ? '👢 ' + publicName(p) + ' was kicked by the host.'
    : reason === 'timeout' ? '🚪 ' + publicName(p) + ' did not reconnect in time.'
    : '🚪 ' + publicName(p) + ' left the game.');
  if (win()) return;
  if (G.phase === 'judge' && p.id === G.judgeId) return judgeResponse(false);
  if (G.phase === 'rebel' && p.id === G.rebelId) { G.rebelId = null; G.deadline = null; return startNight(); }
  if (G.phase === 'night' && nightDone()) resolveNight();
  else if (G.phase === 'nomination' && !waitingNominators().length) resolveNominations();
  else if (G.phase === 'day' && !waitingVoters().length) resolveVote();
  else if (G.phase === 'retrial' && !waitingVoters().length) resolveRetrial();

}

function leaveRoom() {
  if (!confirm('Leave the room?')) return;
  clearSession();
  sess++; clearTimeout(claimTimer);   // blocks stale close/data handlers
  if (isHost) { G.players.forEach(p => { if(p.conn) try{p.conn.send({t:'end'})}catch(e){} }); isHost = false; setTimeout(()=>home('You ended the room.'), 200); }
  else { try{hostConn.send({t:'leave'})}catch(e){}; setTimeout(()=>home('You left.'), 200); }
}

function kick(id) {
  if (!isHost || !G) return;
  const p = G.players.find(x => x.id === id && x !== G.players[0]);
  if (!p) return;
  p.kicked = true; // flag first, so the log line says kicked
  const c = p.conn;
  if (c) try { c.send({t:'kicked'}); } catch(e) {}
  p.conn = null;   // detach so leave() doesn't close the socket before 'kicked' is delivered, and the later close event is a no-op
  leave(p);        // synchronous removal: no window where Start could give them a role
  if (c) setTimeout(() => { try { c.close(); } catch(e) {} }, 250);
}

function send(d) {
  if (d.t === 'vote' || d.t === 'judge' || d.t === 'rebel') SFX.click();
  else if (d.t === 'act' || d.t === 'oracle' || d.t === 'shapeshift' || d.t === 'oraclePass') SFX.yourTurn();
  if (isHost) act(G.players[0], d); else if (hostConn) { try { hostConn.send(d); } catch(e) {} } }

/* --- GAME ACTIONS --- */
function act(p, d) {

    push(); return;
  }

    if (d.k === 'time') { if (TIMES.includes(+d.val)) { G.opts.time = +d.val; push(); } return; }
    if (OPTIONAL_ROLES.includes(d.k)) { G.opts[d.k] = !!d.val; push(); }

  }

    const target = Math.max(1, Math.min(12, +d.n || 0));
    const NAMES = ['Ava','Ben','Cleo','Dev','Esha','Finn','Gus','Hana','Ivan','Jia','Kai'];
    while (G.players.length < target && G.players.length < MAX_PLAYERS) {
      const nm = NAMES.map(x => 'Bot ' + x).find(x => !G.players.some(q => q.name === x));
      if (!nm) break;
      G.players.push({ id: 'bot_' + Math.random().toString(36).slice(2, 8), name: nm, alive: true, conn: null, bot: true, token: null, joinN: G.joinSeq++, profileId: null });

    if (win()) return;
    if (G.phase === 'night' && nightDone()) return resolveNight();
    if (G.phase === 'nomination' && !waitingNominators().length) return resolveNominations();

    else if (d.k === 'paused') G.botsPaused = !!d.val;

  if (d.t === 'testSpec' && G.testMode && p === G.players[0] && G.phase !== 'lobby') {   // add a fake spectator that chats in the spectator chat
    G.spectators = G.spectators || [];
    if (G.spectators.length >= MAX_SPECTATORS) return;
    const sn = ['Zed','Yan','Xia','Wes'].map(x => 'Spec ' + x).find(x => !G.spectators.some(q => q.name === x));
    if (!sn) return;
    G.spectators.push({ id: 'botspec_' + Math.random().toString(36).slice(2, 8), name: sn, conn: null, bot: true, token: null, joinN: G.joinSeq++ });
    return push();
  }
  if (d.t === 'ghostVote' && ['discussion','nomination','defense','day','retrial'].includes(G.phase) && !p.alive && p.role && !p.gone && !isM(p.role)) {   // town ghosts only: dead Mafia and Shapeshifter cannot name a grudge
    const gt = G.players.find(x => x.id === d.target && x.alive);   // ghosts may name one living player; re-picking replaces it

  }

  }

  }
  if (d.t === 'maf' && G.phase === 'night' && p.alive && isM(p.role)) {   // Mafia-team private chat, night only

    if (isM(p.role) && isM(t.role)) return;

    G.acts[p.id] = t.id;
    if (p.role === 'detective') { G.info[p.id] = publicName(t) + ' is ' + (isM(t.role) ? 'MAFIA 🔪' : 'NOT Mafia ✅'); tl({k:'inv', round:G.round, who:publicName(p), target:publicName(t), mafia:isM(t.role)}); if(G.matchFacts[p.id]){G.matchFacts[p.id].detectiveResults=G.matchFacts[p.id].detectiveResults||[];G.matchFacts[p.id].detectiveResults.push(isM(t.role));if(isM(t.role))G.matchFacts[p.id].detectiveFinds++;} }

function join(codeArg, nameArg, isReconnect) {
  if (busy && !isReconnect) return;
  let n, c;
  if (isReconnect && codeArg && nameArg) { n = nameArg; c = codeArg; }
  else {
    n = nm(); if (!n) return;
    c = $('cd').value.trim().toUpperCase(); if (!c) return home('Enter room code');
  }
  if (isReconnect) cleanup(); else home('Connecting to room ' + c + '...');
  busy = true; code = c; myName = n;

  const s = sess;
  try { peer = new Peer(PEER_OPTS); }
  catch (e) { return home('PeerJS library not loaded. Check internet / INTERNET permission.'); }

  let timeout = setTimeout(() => {
    if (s !== sess) return;
    if (isReconnect) reconnectScreen('Could not reach host. Retrying…');
    else { home('Connection timed out. Check the code and your internet.'); cleanup(); }
  }, 20000);

  const baseGen = isReconnect ? hostGen : 0;
  let probe = baseGen, connected = false;
  const dial = () => {   // try host generation `probe`; later generations exist only after a host hand-over
    hostGen = probe;
    const myProbe = probe;
    const hc = peer.connect(hostIdFor(c, probe), { reliable: true });
    hostConn = hc;
    hc.on('open', () => {
      connected = true;
      hc.send({t:'join', name:n, token:getToken(), profileId:activeProfile()?.id||null});
      saveSession(c, n);
    });
    hc.on('data', d => {
      if (s !== sess) return;
      if (d.t === 'v') {
        clearTimeout(timeout); clearTimeout(claimTimer); try { sessionStorage.removeItem('mafia-displaced'); } catch(e) {} rcTries = 0; clearTimeout(rcTimer);
        V = d.v; hostGen = d.v.gen || 0; lastSucc = d.v.succ || []; lastMe = d.v.you.id; lastChanges = d.v.hostChanges || 0; lastSpectator = !!d.v.spectator;
        render();
      }
      else if (d.t === 'snap') { snapStr = d.s; }
      else if (d.t === 'err') { clearSession(); home(d.m); }
      else if (d.t === 'end') { clearSession(); home('Host ended the game.'); }
      else if (d.t === 'kicked') { clearSession(); home('You were kicked by the host.'); }
      else if (d.t === 'replaced') { noResume = true; try { sessionStorage.setItem('mafia-displaced', c); } catch(e) {} home('You joined from another tab or device, so this one was disconnected.'); }
    });

    setTimeout(() => { if (s === sess && !connected && probe === myProbe && probe < MAX_HOST_CHANGES) { probe++; dial(); } }, 6000);
  };

    if (s !== sess) return; myId = id;
    dial();
  });

  peer.on('disconnected', () => {
    if (s === sess && peer && !peer.destroyed) { try { peer.reconnect(); } catch(e) {} }
  });

  peer.on('error', e => {
    if (s !== sess) return;
    if (e.type === 'peer-unavailable' && !connected && probe < MAX_HOST_CHANGES) { probe++; return dial(); }   // maybe the host changed
    clearTimeout(timeout); hostGen = baseGen;
    const m = e.type === 'peer-unavailable' ? 'Room not found. Check the code.' : 'Network error: ' + e.type;
    if (isReconnect) reconnectScreen(m); else { clearSession(); home(m); }
  });
}

      if (v.phase === 'defense') h += `<div class="card"><h3>⚖️ Defence</h3><p class="muted">Candidates: ${(v.candidates||[]).map(x=>esc(x.name)).join(', ')}. They can explain themselves in public chat. Final voting begins when this timer ends.</p></div>`;
      if (v.phase === 'day' || v.phase === 'retrial') {
        if (v.silenced && v.you.alive) h += `<p class="muted" style="margin-top:12px">✊ You are silenced today. You cannot vote.</p>`;
        if (v.need === 'vote') h += `<p style="margin-top:12px">${v.tie ? '⚖️ Retrial: vote for one of the two' : 'Cast your final vote'}:</p>` + btns(v, 'vote');
        else if (v.counting) h += `<p class="muted" style="margin-top:10px">🗳️ Counting the votes...</p>`;
        else if (v.voted) h += `<p class="muted" style="margin-top:10px">Vote cast. Waiting for ${v.waiting}...</p>`;
      }
    }
    if (v.phase === 'judge') {
      const nm2 = v.tie.map(id => (v.players.find(p => p.id === id) || {}).name).join(' and ');
      h += `<div class="prompt-card"><h3>⚖️ Tie: ${esc(nm2)}</h3><p>Call a retrial between them? (once per game)</p><button onclick="send({t:'judge',call:true})">Call retrial</button><button class="gray" onclick="send({t:'judge',call:false})">No retrial</button></div>`;
    }
    if (v.phase === 'rebel') {
      h += `<div class="prompt-card rebel"><h3>✊ You are about to be executed!</h3><p>Refuse? You survive, but lose your next day vote. (once per game)</p><button onclick="send({t:'rebel',refuse:true})">Refuse execution</button><button class="gray" onclick="send({t:'rebel',refuse:false})">Accept fate</button></div>`;
    }
    if (v.phase === 'shapeshift') {
      h += `<p style="margin-top:12px;color:var(--role-accent);font-weight:600">You were voted out! Choose a Mafia to die in your place (name swap):</p>` + btns(v, 'shapeshift');
    }
  }
  if (v.test && v.host && !['lobby','over'].includes(v.phase)) h += testToolsHTML(v);
  if (v.whisper) h += `<div class="card"><p>👻 <b>Ghost whisper</b></p><p class="muted">${esc(v.whisper)}</p></div>`;
  if (v.phase !== 'night' && v.phase !== 'lobby') h += mafHTML(v);   // ghosts can read the last Mafia chat
  h += ghostHTML(v);
  if (v.spectator) h += specChatHTML(v);
  h += `<div class="players">${v.players.map(p => { const showRole = p.role && (!p.alive || v.phase === 'over' || (p.role === 'mafia' && isM(v.you.role)) || (v.testOpts && v.testOpts.god)); return `<div class="pc ${p.alive?'':'dead'}" ${v.host && p.id !== v.you.id && p.alive ? 'data-id="' + esc(p.id) + '"' : ''}>${av(p.name)}<div><span class="nm">${esc(p.name)}${p.marked ? ' 👻' : ''}</span>${p.dc && p.alive ? '<small>⏳ reconnecting…</small>' : showRole ? `<small class="rl" data-rt="${roleTheme(p.role)}">${ROLES[p.role][2]} ${ROLES[p.role][0]}</small>` : ''}</div>${p.vt == null ? '' : `<span class="vdot ${p.vt ? 'yes' : 'no'}" role="img" aria-label="${p.vt ? 'voted' : 'has not voted'}" title="${p.vt ? 'Voted' : 'Has not voted yet'}"></span>`}</div>`; }).join('')}</div>`;
  if (v.specN) h += `<p class="muted" style="margin-top:10px;text-align:center">👁 ${v.specN} watching</p>`;
  if (v.host && v.players.length > 1) h += '<p class="muted" style="margin-top:10px;text-align:center">Host: hold a player to kick them.</p>';
  h += `<button class="gray" style="margin-top:20px" onclick="leaveRoom()">${v.host?'End Game':v.phase==='over'?'Return to Menu':'Leave Room'}</button>`;
  if (h !== lastBotHtml) {   // rebuild only when the markup really changed
    const oi = $('chatInput'), val = oi ? oi.value : '', hadFocus = oi && document.activeElement === oi;
    const ob = $('chatMessages'), op = $('chatNewBtn');
    chatRestore = (ob && chatExpanded && chatDomSig !== '') ? { top: ob.scrollTop, bottom: ob.scrollTop + ob.clientHeight >= ob.scrollHeight - 5, pill: !!op && !op.classList.contains('hidden') } : null;
    const gi = $('ghostInput'), gval = gi ? gi.value : '', gFocus = gi && document.activeElement === gi;
    const gb = $('ghostMessages'), gp = $('ghostNewBtn');
    ghostRestore = (gb && ghostExpanded && ghostDomSig !== '') ? { top: gb.scrollTop, bottom: gb.scrollTop + gb.clientHeight >= gb.scrollHeight - 5, pill: !!gp && !gp.classList.contains('hidden') } : null;
    const mi = $('mafInput'), mval = mi ? mi.value : '', mFocus = mi && document.activeElement === mi;
    const mb = $('mafMessages'), mp = $('mafNewBtn');
    mafRestore = (mb && mafExpanded && mafDomSig !== '') ? { top: mb.scrollTop, bottom: mb.scrollTop + mb.clientHeight >= mb.scrollHeight - 5, pill: !!mp && !mp.classList.contains('hidden') } : null;
    const si = $('specInput'), sval = si ? si.value : '', sFocus = si && document.activeElement === si;
    $('bot').innerHTML = h; lastBotHtml = h; chatDomSig = ''; ghostDomSig = ''; mafDomSig = ''; specDomSig = '';
    const nsi = $('specInput'); if (nsi && sval) { nsi.value = sval; if (sFocus) nsi.focus(); }
    const ni = $('chatInput'); if (ni && val) { ni.value = val; if (hadFocus) ni.focus(); }
    const ngi = $('ghostInput'); if (ngi && gval) { ngi.value = gval; if (gFocus) ngi.focus(); }
    const nmi = $('mafInput'); if (nmi && mval) { nmi.value = mval; if (mFocus) nmi.focus(); }
  }
  renderChatMessages(v);
  renderSpecMessages(v);
  renderGhostMessages(v);
  renderMafMessages(v);
}


function updTimer() {
  const e = $('tm'); if (!e) return;
  if (!V || !['discussion','nomination','defense','day', 'night', 'shapeshift', 'judge', 'rebel', 'retrial'].includes(V.phase) || !endAt || V.counting || (V.phase === 'night' && !V.you.alive)) { e.textContent = ''; return; }
  const s = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  e.textContent = '⏱ ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  e.className = 'tm' + (s <= 10 ? ' low' : '');
}
setInterval(() => {
  updTimer();
  if (isHost && G) {
    const now = Date.now();
    G.players.filter(p => p.dcAt && now - p.dcAt > GRACE_MS && p !== G.players[0])
              .forEach(p => { p.dcAt = null; leave(p, 'timeout'); });
    if (G && G.spectators && G.spectators.some(sp => !sp.conn && sp.dcAt && now - sp.dcAt > GRACE_MS)) G.spectators = G.spectators.filter(sp => sp.conn || !sp.dcAt || now - sp.dcAt <= GRACE_MS);
    if (G && G.testMode) runBots();
    if (G && G.phase === 'shapeshift' && G.deadline && now >= G.deadline) shiftTimeout();
    if (G && G.phase === 'retrial' && G.deadline && now >= G.deadline) resolveRetrial();
    if (G && G.phase === 'judge' && G.deadline && now >= G.deadline) judgeResponse(false);
    if (G && G.phase === 'rebel' && G.deadline && now >= G.deadline) rebelResponse(false);
    if (G && G.phase === 'discussion' && G.deadline && now >= G.deadline) startNominations();
    if (G && G.phase === 'nomination' && G.deadline && now >= G.deadline) resolveNominations();
    if (G && G.phase === 'defense' && G.deadline && now >= G.deadline) startFinalVote();
    if (G && G.phase === 'night' && G.factAt && now >= G.factAt) {   // narrator line (before the auto-resolve check so sunrise follows it)
      G.factAt = null; G.log.push(nextNightLine()); push();
    }
    if (G && G.phase === 'night' && G.deadline && now >= G.deadline) {   // idle players are skipped
      G.players.forEach(p => { if (needsAct(p) && !(p.id in G.acts)) G.acts[p.id] = null; });
      G.deadline = null; resolveNight();
    }
    // host ends the vote when time runs out (players who didn't vote count as abstaining)
    if (G && G.phase === 'day' && G.deadline && Date.now() >= G.deadline) resolveVote();
  }
}, 500);

function closeOv() { const o = $('ov'); if (o) o.remove(); }
function kickMenu(id) {
  const p = V && V.players.find(x => x.id === id);
  if (!p || !isHost) return;
  closeOv();
  const o = document.createElement('div'); o.id = 'ov';
  o.innerHTML = `<div class="card"><h3>${esc(p.name)}</h3><button id="kk">👢 Kick player</button><button class="gray" id="kc">Cancel</button></div>`;
  const opened = Date.now();
  o.onclick = e => { if (e.target === o && Date.now() - opened > 500) closeOv(); };
  o.querySelector('#kk').onclick = () => { kick(id); closeOv(); };
  o.querySelector('#kc').onclick = closeOv;
  document.body.appendChild(o);
}
function lpStart(e) {
  const el = e.target.closest && e.target.closest('.pc[data-id]');
  if (!el || !isHost || !V) return;
  clearTimeout(lpT);
  const id = el.dataset.id;
  lpT = setTimeout(() => kickMenu(id), 600);
}
function lpEnd() { clearTimeout(lpT); }
document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const oc = btn.getAttribute('onclick') || '';
  if (btn.closest('.grid') || /oraGo|oraclePass|'judge'|'rebel'|chatSend|ghostSend|mafSend/.test(oc)) return;   // these already sound via send() / the chat ping
  SFX.click();
}, { passive: true });
['touchstart', 'mousedown'].forEach(ev => app.addEventListener(ev, lpStart, { passive: true }));
['touchend', 'touchmove', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => app.addEventListener(ev, lpEnd, { passive: true }));
app.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.pc[data-id]')) e.preventDefault(); });

home();
</script>
</body>
</html>
